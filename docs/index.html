<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pax</title>
<meta name="description" content="Prithvi and Nihal's weeknight dinners: who cooks, the recipe, nights in or out, the fridge and the recipe tin.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pax">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Pax: an editorial kitchen magazine. Familjen Grotesk, square corners, black rules.
   White for the week, pistachio for the fridge, peach for the recipe tin; tomato red only for tonight, hearts and ticks.
   One paper cutout per screen. Light only, by design. */
:root {
  --ink: #1d1c1a;
  --paper: #ffffff;
  --cream: #fbf7ec;
  --peach: #f6d8c2;
  --pist: #e3ecc4;
  --butter: #f4e7bf;
  --red: #d8492f;
  --red-ink: #b23a24;
  --muted: #6f6a5c;
  --hair: #e6e3dd;
  --font: "Familjen Grotesk", system-ui, -apple-system, sans-serif;
  --ground: var(--paper);
  color-scheme: light;
}
body[data-tab="list"] { --ground: var(--pist); }
body[data-tab="recipes"] { --ground: var(--peach); }
* { box-sizing: border-box; }
html { background: var(--paper); overflow-x: clip; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.35 var(--font); overflow-x: hidden; overflow-x: clip; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border-radius: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; position: relative; background: var(--paper); }
@media (min-width: 600px) { .app { border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); } }
.hide { display: none !important; }
.k { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.muted { color: var(--muted); }

/* masthead */
.mast { position: relative; overflow: hidden; background: var(--ground); padding: calc(18px + env(safe-area-inset-top)) 20px 16px; border-bottom: 2px solid var(--ink); }
.mast .art { position: absolute; right: -36px; top: calc(-24px + env(safe-area-inset-top)); width: 138px; transform: rotate(8deg); pointer-events: none; }
.mast .art.peas { right: -18px; top: calc(-30px + env(safe-area-inset-top)); transform: rotate(-20deg); width: 128px; }
.mast .art.carrots { right: -28px; top: calc(-34px + env(safe-area-inset-top)); transform: rotate(28deg); }
.mast .line { position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-right: 84px; }
.mast .word { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.mast .row { position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 12px; }
.mast h1 { margin: 0; font-size: 38px; font-weight: 700; letter-spacing: -0.03em; line-height: .95; }
.mast .sub { position: relative; font-size: 14px; margin-top: 7px; max-width: calc(100% - 96px); }
.mast .note { position: relative; font-size: 14px; margin: 8px 0 0; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.arrows { display: flex; flex: none; }
.sq { width: 38px; height: 38px; border: 1.5px solid var(--ink); background: transparent; display: grid; place-items: center; padding: 0; }
.arrows .sq + .sq { border-left: 0; }
.bar { position: relative; margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; background: var(--ink); color: var(--cream); border: 0; text-align: left; font-size: 15px; font-weight: 600; text-decoration: none; }
.bar span span { font-weight: 400; opacity: .8; }
.textlink { position: relative; display: inline-block; margin-top: 8px; padding: 0; border: 0; background: none; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

main.view { padding: 18px 20px calc(110px + env(safe-area-inset-bottom)); }
.banner { margin: 0 0 12px; padding: 10px 12px; border: 1.5px solid var(--ink); background: var(--butter); font-size: 14px; }

/* bottom tabs */
.tabbar { position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 18px calc(10px + env(safe-area-inset-bottom)); background: var(--paper); border-top: 2px solid var(--ink); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; padding: 4px 0; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #8a8370; }
.tabbar button[aria-current="page"] { color: var(--ink); }
body.out .tabbar, body.full .tabbar { display: none; }

/* week */
/* The week is a calendar: one row per day, same shape whatever the night is. */
.cal { margin-top: -8px; }
.day { position: relative; display: grid; grid-template-columns: 50px 72px minmax(0, 1fr); align-items: center; gap: 0 14px; width: 100%; min-height: 96px; padding: 12px 0; border: 0; border-bottom: 1px solid var(--hair); background: none; color: var(--ink); text-align: left; font: inherit; }
.day .date { display: grid; justify-items: center; align-content: center; gap: 2px; align-self: stretch; border-right: 1px solid var(--ink); padding-right: 8px; }
.day .date b { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.day .date strong { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.day .thumb { position: relative; width: 72px; height: 72px; overflow: hidden; background: var(--cream); display: grid; place-items: center; }
.day .thumb img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.day .thumb img.art { width: 82%; height: 82%; object-fit: contain; }
.day .thumb svg { color: var(--muted); }
.day .thumb.ink { background: var(--ink); }
.day .thumb.open { background: var(--paper); border: 1.5px dashed var(--ink); }
.day .thumb.open svg { color: var(--ink); }
.day .thumb.ink svg { color: var(--cream); }
.day .what { display: grid; gap: 3px; min-width: 0; }
.day .name { font-size: 18px; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.day .meta { font-size: 13px; color: var(--muted); }
.day .chip { justify-self: start; margin-top: 4px; font-size: 10px; font-weight: 700; letter-spacing: .12em; padding: 4px 7px 3px; border: 1.5px solid var(--ink); background: var(--paper); }
.day .chip.p-prithvi { background: var(--peach); border-color: var(--peach); }
.day .chip.p-nihal { background: var(--pist); border-color: var(--pist); }
.day.past { opacity: .5; }
.day.today .date { background: var(--ink); color: var(--paper); border-right-color: var(--ink); margin: -12px 0; padding: 12px 8px 12px 0; }
.day.today .date b { color: var(--butter); }
.ahead { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 14px; border: 1.5px solid var(--ink); }
.ahead button { display: grid; gap: 2px; padding: 7px 8px 6px; border: 0; border-left: 1.5px solid var(--ink); background: var(--paper); text-align: left; font: inherit; color: var(--ink); }
.ahead button:first-child { border-left: 0; }
.ahead button span { font-size: 13px; font-weight: 600; }
.ahead button.done { background: var(--ink); color: var(--paper); }
.ahead button.none span { color: var(--muted); font-weight: 400; }
.ahead button.open span::before { content: "\2661  "; }
.ahead button.here { box-shadow: inset 0 -4px 0 var(--red); }
.washi { position: absolute; z-index: 2; top: -2px; left: 70px; width: 62px; height: 18px; background: rgba(216,73,47,.88); transform: rotate(-4deg); pointer-events: none; }
.whoami { margin: 22px 0 0; font-size: 13px; color: var(--muted); }
.whoami button { border: 0; background: none; padding: 0; font-size: 13px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

/* night */
.hero { position: relative; height: 260px; border-bottom: 2px solid var(--ink); background: var(--cream); overflow: hidden; }
.hero img.photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero .art { position: absolute; right: 28px; bottom: 26px; width: 46%; height: 72%; object-fit: contain; object-position: right bottom; }
.hero .sq { position: absolute; top: calc(14px + env(safe-area-inset-top)); background: var(--cream); border: 0; }
.hero .back { left: 14px; }
.hero .pencil { right: 14px; }
.hero .pencil[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
.kicker { position: absolute; left: 20px; bottom: 12px; background: var(--red); color: #ffffff; padding: 7px 10px 6px; }
.kicker.plain { background: var(--ink); }
.night { padding: 20px 20px calc(40px + env(safe-area-inset-bottom)); display: grid; gap: 14px; }
.night h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.02; }
.night .src { font-size: 14px; color: var(--muted); margin-top: 6px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1.5px solid var(--ink); }
.seg button { border: 0; border-left: 1.5px solid var(--ink); background: transparent; font-size: 13px; font-weight: 600; padding: 10px 0; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
.pcv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); }
.pcv div { padding: 9px 10px 10px 0; min-width: 0; }
.pcv div + div { border-left: 1px solid var(--hair); padding-left: 10px; }
.pcv small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.pcv span { display: block; font-size: 14px; margin-top: 3px; line-height: 1.25; overflow-wrap: anywhere; }
.primary { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 50px; padding: 0 16px; background: var(--ink); color: var(--cream); border: 0; font-size: 16px; font-weight: 600; text-decoration: none; width: 100%; text-align: left; }
.primary.red { background: var(--red); color: #ffffff; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.ghost { min-height: 40px; padding: 0 12px; border: 1.5px solid var(--ink); background: var(--paper); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.ghost[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
.ghost.danger { border-color: var(--red-ink); color: var(--red-ink); }
.say { margin: 0; font-size: 15px; line-height: 1.45; }
.say.small { font-size: 13px; color: var(--muted); }
.receipt { position: relative; background: var(--cream); padding: 12px 14px 20px; border: 1px solid var(--hair); margin-bottom: 8px; }
.receipt::after { content: ""; position: absolute; left: -1px; right: -1px; bottom: -8px; height: 8px; background: linear-gradient(-45deg, transparent 6px, var(--cream) 0) 0 0/12px 8px repeat-x, linear-gradient(45deg, transparent 6px, var(--cream) 0) 0 0/12px 8px repeat-x; }
.receipt .rh { display: flex; justify-content: space-between; padding-bottom: 7px; border-bottom: 1px dashed var(--ink); }
.receipt ul { list-style: none; margin: 0; padding: 0; }
.receipt li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dotted #d9d0bb; font-size: 15px; }
.receipt li:last-child { border-bottom: 0; }
.receipt li small { font-size: 12px; color: var(--muted); }
.options { display: grid; gap: 8px; }
.option { display: grid; gap: 2px; width: 100%; padding: 10px 12px; border: 1.5px solid var(--ink); background: var(--paper); text-align: left; }
.option b { font-size: 15px; }
.option span { font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; font-size: 14px; font-weight: 600; list-style: none; padding: 10px 0; border-top: 1px solid var(--hair); }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "+"; float: right; font-weight: 700; }
details[open] summary::after { content: "–"; }
form.stack, .ownform { display: grid; gap: 10px; }
.ownform label, form.stack label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
.ownform label small { font-weight: 400; color: var(--muted); }
.field, .ownform input, .ownform textarea, form.stack input, form.stack select, textarea { width: 100%; min-width: 0; border: 1.5px solid var(--ink); background: var(--paper); padding: 10px 12px; border-radius: 0; font-size: 16px; font-weight: 400; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; border: 1.5px solid var(--ink); padding: 9px 12px; border-radius: 0; }
.addrow button { flex: none; border: 0; background: var(--ink); color: var(--cream); padding: 0 14px; font-weight: 600; }
.confirm { display: grid; gap: 10px; padding: 12px; border: 1.5px solid var(--red-ink); }

/* fridge */
.progress { display: grid; grid-template-columns: repeat(10, 9px); gap: 3px; flex: none; }
.progress span { height: 9px; border: 1.5px solid var(--ink); }
.progress span.on { background: var(--red); border-color: var(--red); }
.fridge { background: var(--paper); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--pist); }
.shelf { padding: 8px 14px 6px; border-bottom: 5px solid var(--ink); }
.shelf.drawer { background: #f3f7e6; }
.shelf .sh { display: flex; justify-content: space-between; padding: 4px 0; }
.item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 0; border: 0; border-top: 1px solid #ece3cc; background: none; text-align: left; font-size: 15px; }
.item .box { width: 20px; height: 20px; border: 1.5px solid var(--ink); flex: none; display: grid; place-items: center; background: var(--paper); }
.item.got span.nm { color: #9d967f; text-decoration: line-through; }
.item.got .box { background: var(--red); border-color: var(--red); color: #ffffff; }
.item small { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }
.item.in { cursor: default; color: var(--muted); }
.item.in .box { border-style: dashed; }
.none { margin: 0; padding: 8px 0 10px; font-size: 14px; color: var(--muted); border-top: 1px solid #ece3cc; }
.door { background: var(--ink); color: var(--cream); }
.door summary { border: 0; padding: 12px 14px; color: var(--cream); }
.door .inner { background: var(--paper); color: var(--ink); padding: 12px 14px 14px; display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--ink); background: var(--paper); padding: 5px 8px 4px; font-size: 13px; font-weight: 600; }
.chip.plain { cursor: default; }

/* recipe tin */
.filters { position: relative; display: flex; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; font-size: 13px; font-weight: 600; padding: 8px 11px 7px; border: 1.5px solid var(--ink); border-left: 0; background: var(--cream); }
.filters button:first-child { border-left: 1.5px solid var(--ink); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
.rtile { display: block; width: 100%; border: 0; padding: 0; background: none; text-align: left; }
.rtile .ph { position: relative; display: block; aspect-ratio: 1 / 1; overflow: hidden; background: var(--cream); }
.rtile .ph img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.rtile .ph img.art { position: absolute; inset: 14%; width: 72%; height: 72%; object-fit: contain; }
.rtile .nm { display: block; font-size: 15px; font-weight: 700; line-height: 1.15; margin-top: 7px; letter-spacing: -0.01em; }
.rtile .mt { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.rtile.torn .ph { filter: grayscale(1); opacity: .6; }
.new { position: absolute; z-index: 1; left: 8px; top: 8px; background: var(--red); color: #ffffff; padding: 4px 6px 3px; }
.boxed { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border: 1.5px solid var(--ink); background: var(--paper); font-size: 14px; text-align: left; }
.list .rec { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.list .rec .t { min-width: 0; }
.list .rec b, .list .rec a { display: block; font-size: 15px; font-weight: 600; }
.list .rec small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.heart { flex: none; width: 40px; height: 40px; border: 1.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; padding: 0; }
.heart[aria-pressed="true"] { background: var(--ink); color: var(--red); }
.section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 6px; padding-top: 10px; border-top: 2px solid var(--ink); }
.section-h h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.nights7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1.5px solid var(--ink); }
.nights7 button { border: 0; border-left: 1.5px solid var(--ink); background: var(--paper); padding: 8px 0; font-size: 12px; font-weight: 600; line-height: 1.2; }
.nights7 button:first-child { border-left: 0; }

/* deck */
.deck { min-height: 100dvh; background: var(--paper); display: flex; flex-direction: column; padding: calc(18px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom)); position: relative; overflow: hidden; }
.deck > .art { position: absolute; right: -40px; top: calc(-26px + env(safe-area-inset-top)); width: 138px; transform: rotate(10deg); pointer-events: none; }
.deck .line { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-right: 84px; }
.deck .line .sq { width: 32px; height: 32px; }
.deck h1 { margin: 12px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: .95; }
.deck .lede { margin: 8px 0 0; font-size: 15px; }
.deck .stage { position: relative; flex: 1; min-height: 380px; margin: 22px 0 0; }
.deckcard { position: absolute; inset: 0; background: var(--cream); border: 2px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); display: flex; flex-direction: column; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
.deckcard .ph { position: relative; flex: 1; min-height: 140px; overflow: hidden; border-bottom: 2px solid var(--ink); background: var(--cream); }
.deckcard .ph img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.deckcard .ph img.art { position: absolute; inset: 12%; width: 76%; height: 76%; object-fit: contain; pointer-events: none; }
.deckcard .body { padding: 14px 16px 16px; }
.deckcard .top { display: flex; justify-content: space-between; gap: 10px; }
.deckcard h2 { margin: 6px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.02; }
.deckcard p { margin: 8px 0 0; font-size: 15px; line-height: 1.4; }
.deckcard .chips { margin-top: 10px; }
.deckcard a { font-size: 14px; font-weight: 600; display: inline-block; margin-top: 10px; }
.deckcard[data-dir]::after { content: "Heart"; position: absolute; z-index: 3; top: 20px; left: 16px; border: 2.5px solid var(--red); color: var(--red); background: var(--cream); padding: 4px 10px; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; transform: rotate(-10deg); opacity: var(--o, 0); }
.deckcard[data-dir="skip"]::after { content: "Not this week"; left: auto; right: 16px; border-color: var(--ink); color: var(--ink); transform: rotate(8deg); }
.tape { position: absolute; z-index: 4; top: -10px; left: 50%; width: 86px; height: 22px; margin-left: -43px; background: rgba(216,73,47,.88); transform: rotate(-3deg); pointer-events: none; }
.choose { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 26px; }
.choose button { min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid var(--ink); background: var(--cream); font-size: 16px; font-weight: 600; }
.choose button.go { background: var(--ink); color: var(--cream); }
.deckfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; }
.deckfoot button { border: 0; background: none; padding: 6px 0; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.deckfoot span { font-size: 12px; color: var(--muted); }
.hearts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; margin-top: 14px; }
.hearts span { border: 1.5px dashed var(--ink); padding: 7px 9px; font-size: 13px; line-height: 1.25; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hearts span b { display: block; }
.hearts span.on { border-style: solid; background: var(--peach); }
.hearts span.now { border-style: solid; }
.deckrows { display: grid; gap: 8px; margin-top: 18px; }
.deckrow { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: center; border: 1.5px solid var(--ink); background: var(--paper); padding: 10px 12px; }
.deckrow .d { text-align: center; line-height: 1; }
.deckrow .d b { display: block; font-size: 22px; font-weight: 700; margin-top: 3px; }
.deckrow strong { display: block; font-size: 16px; }
.deckrow small { display: block; font-size: 13px; color: var(--muted); }
.deck .actions2 { display: grid; gap: 10px; margin-top: auto; padding-top: 22px; }

/* who / toast */
.signin { display: grid; gap: 12px; }
.signin .say { margin: 0 0 6px; }
.signin h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom)); max-width: calc(100% - 40px); background: var(--ink); color: var(--cream); padding: 11px 14px; font-size: 14px; font-weight: 600; }
body.full .toast { bottom: calc(24px + env(safe-area-inset-bottom)); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body data-tab="tonight">
<div class="app">
  <header class="mast" id="mast"><div class="line"><span class="word">Pax</span></div></header>
  <div id="banner" class="banner" hidden></div>
  <main class="view" id="view"><p class="say">Getting this week's dinners…</p></main>
</div>
<nav class="tabbar" aria-label="Sections">
  <button id="tab-tonight" data-tab="tonight"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16"/><path d="M3 9.5h18M8 3v3M16 3v3"/></svg>Week</button>
  <button id="tab-list" data-tab="list"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19"/><path d="M6 9h12M9 5.5v1.5M9 12v3"/></svg>Fridge</button>
  <button id="tab-recipes" data-tab="recipes"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><rect x="3" y="9" width="18" height="11"/><path d="M6 9V5.5h5l1.5 1.5H18V9"/></svg>Recipe tin</button>
</nav>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="pax-db.js"></script>
<script>
const SLOTS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const DAY = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday", sun: "Sunday" };
const COOK = { prithvi: "Prithvi", nihal: "Nihal" };
const OTHER = { prithvi: "nihal", nihal: "prithvi" };

const S = {
  db: null, user: null, me: null, canWrite: true,
  weeks: {}, weekId: null, nights: {}, checks: {}, rejects: {}, box: {}, inbox: {}, hauls: {}, decks: {}, picks: {}, deck: null, staples: [], requests: {},
  tab: "tonight", focus: null, ui: {}, loaded: false,
  tin: { tab: "all", card: null, picking: false },
};
// Per-viewer conveniences only: the fridge stays open for the session, and the handle tip shows once per phone.
function store(kind, key, val) { try { const st = kind === "session" ? sessionStorage : localStorage; if (val === undefined) return st.getItem(key); st.setItem(key, val); } catch (_) { return null; } }
let unsubWeek = [];

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeLink = u => /^https:\/\//i.test(u || "") ? u : "";
const slug = s => String(s || "").toLowerCase().replace(/^https?:\/\//, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 150) || "x";
const recipeKey = r => slug(r.link || r.dish);
const norm = s => String(s || "").trim().toLowerCase();
function localISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); return localISO(new Date(y, m - 1, d + n)); }
function shortDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
const dayNum = iso => String(Number(iso.slice(8)));
const today = () => localISO(new Date());
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }
function stamp() { return { by: S.myName || null, at: new Date().toISOString() }; }
function fmtTime(t) { if (!t) return ""; const [h, m] = t.split(":").map(Number); return ((h % 12) || 12) + (m ? ":" + String(m).padStart(2, "0") : "") + (h >= 12 ? "pm" : "am"); }

async function write(fn, okMsg) {
  if (!S.db) { toast("Pax is still loading. Try again in a moment."); return; }
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) {
    console.error(e);
    if (e && (e.code === "42501" || /row-level security/i.test(e.message || ""))) toast("Pax didn't accept that change. Try again in a moment.");
    else toast("That didn't save. Check your connection and try again.");
  }
}

/* ---------- derived state ---------- */
const week = () => S.weeks[S.weekId] || null;
function slotDate(slot) { return addDays(S.weekId, SLOTS.indexOf(slot)); }
// Plan kinds: cook, out, order, flex ("skip" from older plans reads as out). A night's flag overrides the plan.
const planKind = k => k === "skip" ? "out" : (k || "flex");
const flagMode = f => f === "skip" ? "out" : f;

function nightView(slot) {
  const w = week() || {};
  let plan = (w.nights || {})[slot] || { kind: "flex" };
  let picking = null;
  // A cook night dealt as a Sunday deck has no options until its cook picks. After the deadline, Claude's picks stand in.
  // Whoever's deck holds this night picks it, even if the night was handed over after the deck was dealt.
  const dealtTo = planKind(plan.kind) === "cook" && !(plan.options || []).length ? Object.keys((deckFor(S.weekId) || {}).people || {}).find(p => deckNights(S.weekId, p).includes(slot)) : null;
  if (dealtTo) {
    if (deckPast(S.weekId)) { const f = autoFill(S.weekId, dealtTo)[slot]; if (f) plan = { ...plan, options: [{ ...f.card, auto: true }, ...f.backups] }; }
    else picking = dealtTo;
  }
  const st = S.nights[slot] || {};
  const pk = planKind(plan.kind);
  const mode = flagMode(st.flag) || pk;
  const cook = st.cook || plan.cook || null;
  const rejected = new Set(st.rejected || []);
  const opts = (plan.options || []).filter(o => !rejected.has(o.id) && !S.rejects[recipeKey(o)]);
  let current = null;
  const blank = !!(st.boxPick && st.boxPick.blank);
  if (blank) { current = null; picking = null; }
  else if (st.boxPick && !S.rejects[recipeKey(st.boxPick)]) current = { ...st.boxPick, fromBox: true };
  else current = opts.find(o => o.id === st.current) || opts[0] || null;
  const backups = opts.filter(o => !current || o.id !== current.id);
  const request = Object.values(S.requests).find(r => r.week === S.weekId && r.slot === slot && r.status === "open");
  return { slot, date: slotDate(slot), plan, st, pk, mode, cook, current, backups, request, picking, blank };
}

function noteText(n) {
  if (n.mode === "cook") {
    if (n.current && n.current.pending) return { title: n.current.dish, sub: `From ${n.current.source || "a link"}${n.current.savedBy ? " · saved by " + n.current.savedBy : ""}` };
    if (n.current && n.current.own) return { title: n.current.dish, sub: "Your own" + (n.current.by ? " · " + n.current.by : "") };
    if (n.current) return { title: n.current.dish, sub: [n.current.minutes ? n.current.minutes + " min" : "", n.current.cuisine].filter(Boolean).join(" · ") };
    if (n.blank) return { title: "Nothing planned", sub: "" };
    if (n.picking) return n.picking === myKey() ? { title: "Your pick", sub: "Heart it in your Sunday picks" } : { title: `${COOK[n.picking]}'s picking`, sub: "From the Sunday deck" };
    return { title: "Nothing yet", sub: "Pick from the recipe box or ask Claude" };
  }
  if (n.mode === "flex") return { title: n.plan.label || "Free night", sub: n.plan.note || "Out, in, or leftovers" };
  const planned = n.pk === n.mode;
  const title = planned && n.plan.label ? n.plan.label : (n.mode === "order" ? "Ordering in" : "Eating out");
  const sub = n.current && n.pk === "cook" ? n.current.dish + " is off the list" : (planned ? n.plan.note || "" : "");
  return { title, sub };
}

/* ---------- Sunday decks ---------- */
// decks/<week>: { deadline, lean: {mon: "asian"|"other"}, people: {prithvi: {nights: [...], cards: [...]}} }
// decks/<week>/picks/<person>: { pos, hearts, never, skipped, auto, done, slots }
const ASIAN = ["asian", "chinese", "indo-chinese", "sichuan", "hunan", "korean", "thai", "japanese", "vietnamese", "taiwanese", "malaysian", "indonesian", "filipino"];
const isAsian = c => c.asian ?? ASIAN.includes(norm(c.cuisine));
const myKey = () => norm(S.myName);
const deckFor = w => S.decks[w] || null;
const picksFor = (w, p) => (S.picks[w] || {})[p] || {};
const deckPerson = (w, p) => ((deckFor(w) || {}).people || {})[p] || null;
const deckNights = (w, p) => (deckPerson(w, p) || {}).nights || [];
const deckCards = (w, p) => ((deckPerson(w, p) || {}).cards || []).filter(c => !S.rejects[recipeKey(c)]);
function deckPast(w) { const d = deckFor(w); return !!(d && d.deadline && Date.now() > Date.parse(d.deadline)); }
// Line dishes up with nights so Asian ones land on the week's Asian nights where they can.
function bestOrder(cards, nights, lean) {
  const perms = a => a.length <= 1 ? [a] : a.flatMap((x, i) => perms([...a.slice(0, i), ...a.slice(i + 1)]).map(p => [x, ...p]));
  let best = cards, score = -1;
  for (const p of perms(cards)) {
    const sc = p.reduce((n, c, i) => n + ((lean || {})[nights[i]] ? (isAsian(c) === (lean[nights[i]] === "asian") ? 1 : 0) : 0), 0);
    if (sc > score) { best = p; score = sc; }
  }
  return best;
}
// Backups for each night: the rest of the deck, minus anything marked never, matching the pick's style first.
function deckBackups(order, avail) {
  const left = [...avail];
  return order.map(pick => {
    const mine = [...left.filter(c => isAsian(c) === isAsian(pick)), ...left.filter(c => isAsian(c) !== isAsian(pick))].slice(0, 2);
    mine.forEach(c => left.splice(left.indexOf(c), 1));
    return mine;
  });
}
// What a cook gets if the deadline passes: their hearts, then the deck's top cards for each night's style.
function autoFill(w, p) {
  const pk = picksFor(w, p), cards = deckCards(w, p), nights = deckNights(w, p), lean = (deckFor(w) || {}).lean || {};
  const never = new Set(pk.never || []);
  const avail = cards.filter(c => !never.has(c.id));
  const chosen = avail.filter(c => (pk.hearts || []).includes(c.id)).slice(0, nights.length);
  for (const sl of nights.slice(chosen.length)) {
    const rest = avail.filter(c => !chosen.includes(c));
    const c = rest.find(c => !lean[sl] || isAsian(c) === (lean[sl] === "asian")) || rest[0];
    if (c) chosen.push(c);
  }
  const order = bestOrder(chosen, nights, lean);
  const backups = deckBackups(order, avail.filter(c => !chosen.includes(c)));
  return Object.fromEntries(nights.map((sl, i) => [sl, order[i] ? { card: order[i], backups: backups[i] } : null]));
}
// A deck I can still swipe: dealt to me, with nights to fill, not finished, deadline not passed.
function deckOpenFor(w, me = myKey()) { return !!(deckFor(w) && addDays(w, 6) >= today() && deckNights(w, me).length && deckCards(w, me).length && !picksFor(w, me).done && !deckPast(w)); }
// The earliest deck still waiting on me (after `after`, if given).
function openDeckWeek(after = "") { return Object.keys(S.decks).sort().find(w => w > after && deckOpenFor(w)) || null; }

function chooseWeek() {
  const ids = Object.keys(S.weeks).sort();
  if (!ids.length) return null;
  const t = today();
  return ids.find(id => id <= t && t <= addDays(id, 6)) || ids.find(id => id > t) || ids[ids.length - 1];
}
// The next seven nights, tonight first: where "Add a recipe" (and the Shortcut) can put a dish.
function upcomingNights() {
  return Array.from({ length: 7 }, (_, i) => { const date = addDays(today(), i); return { date, label: (i === 0 ? "Tonight, " : "") + new Date(date + "T12:00").toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" }) }; });
}
const mondayOf = iso => { const d = new Date(iso + "T12:00"); return addDays(iso, -((d.getDay() + 6) % 7)); };
const siteOf = u => /tiktok\.com/i.test(u) ? "TikTok" : /instagram\.com/i.test(u) ? "Instagram" : u ? "the web" : "";
function thisMonday() { const d = new Date(); return addDays(today(), -((d.getDay() + 6) % 7)); }
function weekLabel(id) {
  const diff = Math.round((new Date(id) - new Date(thisMonday())) / 864e5 / 7);
  return diff === 0 ? "This week" : diff === 1 ? "Next week" : diff === -1 ? "Last week" : "Week of " + shortDate(id);
}

/* ---------- render ---------- */
const ICON = {
  left: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
  arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  out: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  heart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  heartLine: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  pencil: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M16.5 3.5l4 4L8 20H4v-4z"/></svg>',
  tick: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="square" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
};
// The paper cutouts in docs/illustrations/. Every recipe without a photo shows the one closest to what's
// in it: the dish name first, then its veg, then its ingredients. A card can name one outright with `art`.
const ART_WORDS = [
  ["eggplant", /eggplant|aubergine|baingan|brinjal/],
  ["mushrooms", /mushroom|shiitake|portobello|oyster mush/],
  ["pumpkin", /pumpkin|squash|kabocha|butternut/],
  ["corn", /\bcorn\b|elote|makai|bhutta/],
  ["chickpeas", /chickpea|chana|chole|garbanzo|hummus|falafel|usal|rajma|\bbeans?\b|lentil|\bdal\b|daal|masoor|moong/],
  ["broccoli", /broccoli|broccolini|gai lan/],
  ["avocado", /avocado|guac/],
  ["carrots", /carrot|gajar/],
  ["peas", /\bpeas?\b|matar|mutter|edamame|snap pea/],
  ["noodles", /noodle|udon|ramen|soba|lo mein|chow mein|hakka|pad thai|pad see|japchae/],
  ["tofu", /tofu|paneer|tempeh|seitan/],
  ["rice", /\brice\b|biryani|pulao|pilaf|risotto|bibimbap|khichdi|congee|burrito bowl/, true],
  ["chili", /chil+i|chilies|mirchi|jalape|szechuan|sichuan|kung pao|krapow|gochu/],
  ["pepper", /bell pepper|capsicum|shishito/],
  ["strawberry", /strawberr|berry|berries/],
  ["fish", /\bfish\b|salmon|tuna|cod\b/],
  ["egg", /\beggs?\b|omelet|shakshuka|frittata/],
  ["bread", /bread|\btoast\b|naan|roti|pav\b|sandwich|burger|pita|focaccia|bun\b|bao\b/],
  ["tomato", /tomato|marinara|vodka|arrabbiata|pomodoro|makhani|tikka/],
  ["onion", /onion|pyaz|shallot/, true],
  ["lemon", /lemon|lime|citrus/, true],
  ["garlic", /garlic|lahsun/, true],
];
const ART = Object.fromEntries([...ART_WORDS.map(([n]) => n), "tomato"].map(n => [n, `illustrations/${n}.png`]));
function artFor(card) {
  const c = card && typeof card === "object" ? card : { dish: card };
  if (c.art && ART[c.art]) return c.art;
  // Rice, onion, lemon and garlic are in almost everything, so they only count in the name or the veg.
  const passes = [[String(c.dish || ""), false], [String(c.veg || ""), false], [(c.ingredients || []).join(" "), true]];
  for (const [text, skipCommon] of passes) for (const [name, re, common] of ART_WORDS) if (!(skipCommon && common) && re.test(text.toLowerCase())) return name;
  return ["tomato", "peas", "carrots"][[...String(c.dish || "")].reduce((n, ch) => n + ch.charCodeAt(0), 0) % 3];
}
// A recipe's photo, if it has one; a broken link quietly falls back to the coloured tile.
const photo = c => { const u = safeLink(c && c.image); return u ? `<img class="photo" src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""; };
const dayUp = iso => new Date(iso + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }).toUpperCase();

function showBanner() {
  const b = document.getElementById("banner");
  if (S.offline) { b.textContent = "You're offline. Showing the plan as it was; changes save once you're back online."; b.hidden = false; }
  else b.hidden = true;
}

function render() {
  const full = !!(S.deck || (S.tab === "tonight" && S.focus));
  document.body.dataset.tab = S.tab;
  document.body.classList.toggle("full", full);
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  if (!S.loaded) return;
  const mast = document.getElementById("mast"), v = document.getElementById("view");
  if (S.deck) { mast.innerHTML = ""; mast.hidden = true; v.className = ""; v.innerHTML = renderDeck(); }
  else if (S.tab === "tonight" && S.focus && S.weekId) { mast.innerHTML = ""; mast.hidden = true; v.className = ""; v.innerHTML = renderOpen(nightView(S.focus)); }
  else {
    mast.hidden = false; v.className = "view";
    const [m, body] = S.tab === "list" ? renderList() : S.tab === "recipes" ? renderRecipes() : renderWeekView();
    mast.innerHTML = m; v.innerHTML = body;
  }
  resolveNames();
}

function masthead({ word, dateline, title, art, side = "", extra = "" }) {
  return `<img class="art ${art}" src="${ART[art]}" alt="" aria-hidden="true">
    <div class="line"><span class="word">${esc(word)}</span><span class="k">${esc(dateline)}</span></div>
    <div class="row"><h1>${title}</h1>${side}</div>${extra}`;
}

function noWeek() {
  return `<p class="say">Nothing planned yet. Claude deals the Sunday picks every Sunday evening, and the week shows up here.</p>`;
}

function deckBanner(w, other) {
  if (!w) return "";
  const me = myKey(), nights = deckNights(w, me), n = deckCards(w, me).length, pk = picksFor(w, me);
  const d = deckFor(w), due = d.deadline ? new Date(d.deadline) : null;
  const by = !due ? "" : due - Date.now() < 6 * 864e5 ? "by 9pm Sun" : "by Sun " + due.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "America/New_York" });
  const label = (other ? `Week of ${shortDate(w)}: ` : "") + (nights.length === 1 ? `Pick ${DAY[nights[0]]}'s dinner` : `Pick ${nights.length} dinners`);
  return `<button class="bar" data-act="deck" data-v="${w}"><span>${esc(label)} <span>· ${n} dishes${(pk.pos || 0) > 0 ? " · keep going" : ""}${by ? " · " + by : ""}</span></span>${ICON.arrow}</button>`;
}

// The next four weeks at a glance, so you can swipe ahead whenever you like.
function aheadStrip() {
  const me = myKey(), start = addDays(thisMonday(), 7);
  const cells = [0, 7, 14, 21].map(k => {
    const w = addDays(start, k), d = deckFor(w), pk = picksFor(w, me);
    const mine = d && deckNights(w, me).length;
    const st = !d ? ["Not dealt", "none"] : !mine ? ["Not cooking", "none"] : pk.done ? ["Picked", "done"] : deckPast(w) ? ["Claude picked", "done"] : [(pk.hearts || []).length ? `${Math.min(pk.hearts.length, deckNights(w, me).length)} of ${deckNights(w, me).length}` : "Pick", "open"];
    return `<button class="${st[1]}${w === S.weekId ? " here" : ""}" data-act="${st[1] === "open" ? "deck" : "week"}" data-v="${w}"><b class="k">${esc(dayUp(w))}</b><span>${esc(st[0])}</span></button>`;
  });
  return `<div class="ahead" role="group" aria-label="Your picks for the next four weeks">${cells.join("")}</div>`;
}
function renderWeekView() {
  const me = myKey();
  const w = week();
  const id = S.weekId || thisMonday();

  const myPk = S.weekId ? picksFor(S.weekId, me) : {};

  const barWeek = S.weekId && deckOpenFor(S.weekId) ? S.weekId : S.weekId && S.weekId <= addDays(thisMonday(), 7) ? openDeckWeek(S.weekId) : null;
  const deckLink = myDeck && !deckOpenFor(S.weekId) ? `<button class="textlink" data-act="deck" data-v="${S.weekId}">Your Sunday picks · ${myPk.done ? "done, tap to change" : (myPk.pos || 0) > 0 ? "keep going" : deckNights(S.weekId, me).some(sl => (((week() || {}).nights || {})[sl] || {}).options?.length) ? "picking again" : "not started"}</button>` : "";

function renderRequest(n, dis) {

function buildList() {
  const map = new Map();
  for (const slot of SLOTS) {
    const n = nightView(slot);
    if (n.mode !== "cook" || !n.current) continue;
    for (const raw of n.current.ingredients || []) {
      const k = norm(raw); if (!k) continue;
      if (!map.has(k)) map.set(k, { key: slug(k), name: raw.trim(), dishes: [] });
      map.get(k).dishes.push(DAY[slot].slice(0, 3) + ": " + n.current.dish);
    }
  }
  const staples = new Set(S.staples.map(norm));
  const buy = [], have = [];
  for (const [k, it] of map) (staples.has(k) ? have : buy).push(it);
  const by = (a, b) => a.name.localeCompare(b.name);
  return { buy: buy.sort(by), have: have.sort(by) };
}

const SHELVES = [
  { id: "frozen", label: "Freezer" },
  { id: "dairy", label: "Top shelf · dairy & tofu" },
  { id: "pantry", label: "Middle shelf · pantry" },
  { id: "produce", label: "Crisper drawer · produce", cls: "drawer" },
];
// The planner tags each ingredient with a shelf (week.shelves); this guesses for anything it missed.
const GUESS = {
  frozen: ["frozen"],
  dairy: ["paneer", "feta", "parmesan", "cheese", "cheddar", "monterey", "mozzarella", "ricotta", "cream", "milk", "yogurt", "curd", "butter", "ghee", "egg", "tofu", "tempeh", "seitan"],
  produce: ["avocado", "cilantro", "rosemary", "chili", "lemon", "lime", "cabbage", "spinach", "tomato", "kale", "broccoli", "scallion", "onion", "garlic", "ginger", "mint", "arugula", "basil", "carrot", "potato", "cucumber", "zucchini", "mushroom", "pepper", "herb", "parsley", "dill", "greens", "lettuce", "curry leaves", "cauliflower", "eggplant", "squash", "peas", "bok choy", "fennel", "shallot", "beans"],
};
const PANTRY = ["chickpea", "bean", "lentil", "dal", "tortilla", "pasta", "ditalini", "orzo", "noodle", "rice", "roti", "naan", "bread", "salsa", "broth", "paste", "sauce", "vinegar", "oil", "sugar", "flour", "coconut milk", "cashew", "nut", "chili crisp", "sesame seed", "spice", "masala", "powder", "seeds", "soya"];
function shelfOf(name) {
  const n = norm(name), w = week() || {};
  const tagged = (w.shelves || {})[n];
  if (tagged && SHELVES.some(x => x.id === tagged)) return tagged;
  if (GUESS.frozen.some(g => n.includes(g))) return "frozen";
  if (PANTRY.some(g => n.includes(g)) && !GUESS.dairy.some(g => n.includes(g))) return "pantry";
  for (const id of ["dairy", "produce"]) if (GUESS[id].some(g => n.includes(g))) return id;
  return "pantry";
}

// Grocery hauls the planner read from DoorDash receipts (hauls/<order>). Fresh things count as
// "in the fridge" for a week (frozen for a month); shelf-stable things go to staples instead.
function recentHaul() {
  const out = new Map(), t = today();
  for (const h of Object.values(S.hauls)) {
    if (!h || !h.date) continue;
    for (const it of h.items || []) {
      if (!it || !it.name || it.keep === "pantry" || it.keep === "skip") continue;
      if (addDays(h.date, it.shelf === "frozen" ? 30 : 7) < t) continue;
      const key = slug(norm(it.name));
      if (!out.has(key) || out.get(key).date < h.date) out.set(key, { key, name: it.name, shelf: it.shelf, date: h.date, store: h.store || "" });
    }
  }
  return out;
}
// Ticked by hand wins; otherwise anything in a recent haul counts as got.
function isGot(key) { const items = S.checks.items || {}; return key in items ? !!items[key] : recentHaul().has(key); }

function renderList() {
  const id = S.weekId || thisMonday();
  if (!S.weekId) return [masthead({ word: "The fridge", dateline: dayUp(id), title: "Nothing yet", art: "peas" }), noWeek()];
  const { buy, have } = buildList();
  const dis = S.canWrite ? "" : "disabled";
  const haul = recentHaul();
  const checks = Object.fromEntries(buy.map(i => [i.key, isGot(i.key)]));
  const got = buy.filter(i => checks[i.key]).length, left = buy.length - got;
  const listed = new Set([...buy, ...have].map(i => i.key));
  const extras = [...haul.values()].filter(h => !listed.has(h.key));
  const filled = buy.length ? Math.round(10 * got / buy.length) : 0;
  const prog = buy.length ? `<span class="progress" role="img" aria-label="${got} of ${buy.length} got">${Array.from({ length: 10 }, (_, i) => `<span class="${i < filled ? "on" : ""}"></span>`).join("")}</span>` : "";
  const mast = masthead({ word: "The fridge", dateline: `Week of ${dayUp(id)}`, title: buy.length ? (left ? `${left} to buy` : "Got everything") : "Nothing to buy", art: "peas", side: prog,
    extra: `<div class="sub">${[got && `${got} already in`, have.length && `${have.length} staple${have.length === 1 ? "" : "s"} at home`, extras.length && `${extras.length} more from your last order`].filter(Boolean).join(" · ") || "Built from the dinners you're cooking."}</div>` });
  const item = it => `<button class="item${checks[it.key] ? " got" : ""}" data-act="tick" data-key="${esc(it.key)}" aria-pressed="${!!checks[it.key]}" ${dis}><span class="box">${checks[it.key] ? ICON.tick : ""}</span><span class="nm">${esc(it.name)}</span><small>${esc([...new Set(it.dishes.map(d => d.slice(0, 3)))].join(", "))}</small></button>`;
  const inItem = h => `<div class="item in"><span class="box"></span><span class="nm">${esc(h.name)}</span><small>From ${esc(h.store || "your order")}, ${esc(shortDate(h.date))}</small></div>`;
  let shelves = "";
  for (const sh of SHELVES) {
    const items = buy.filter(i => shelfOf(i.name) === sh.id);
    const inside = extras.filter(h => (SHELVES.some(x => x.id === h.shelf) ? h.shelf : shelfOf(h.name)) === sh.id);
    if (sh.id === "frozen" && !items.length && !inside.length) continue;
    shelves += `<section class="shelf ${sh.cls || ""}" aria-label="${esc(sh.label)}"><div class="sh k"><span>${esc(sh.label)}</span><span>${items.length}</span></div>${items.map(item).join("") || `<p class="none">Nothing to buy here.</p>`}${inside.map(inItem).join("")}</section>`;
  }
  const door = `<details class="door" id="staples-box" ${S.staplesOpen ? "open" : ""}><summary>Door · already have <span style="font-weight:400;opacity:.8">${have.length} this week · ${S.staples.length} staples</span></summary><div class="inner">
      ${have.length ? `<div class="k">Used this week</div><div class="chips">${have.map(i => `<span class="chip plain">${esc(i.name)}</span>`).join("")}</div>` : ""}
      <div class="k">Your staples · tap to remove</div>
      <div class="chips">${S.staples.map(x => `<button class="chip" data-act="unstaple" data-name="${esc(x)}" aria-label="Remove ${esc(x)}" ${dis}>${esc(x)} ×</button>`).join("") || `<span class="say small">No staples yet.</span>`}</div>
      <form class="addrow" id="staple-form"><input type="text" id="staple-input" placeholder="Add a staple, e.g. basmati rice" aria-label="Add a staple" ${dis}><button ${dis}>Add</button></form>
      ${buy.length ? `<div class="k">Move to staples</div><div class="chips">${buy.map(i => `<button class="chip" data-act="staple" data-name="${esc(i.name)}" ${dis}>+ ${esc(i.name)}</button>`).join("")}</div>` : ""}
    </div></details>`;
  return [mast, `<div class="fridge">${shelves}${door}</div><p class="say small" style="margin-top:16px">Tap anything you've got. Swap a dish or mark a night out and the list changes with it.</p>`];
}

function allPlanned() {
  const seen = new Map();
  for (const id of Object.keys(S.weeks).sort().reverse()) {
    const w = S.weeks[id];
    for (const slot of SLOTS) for (const o of ((w.nights || {})[slot] || {}).options || []) {
      const k = recipeKey(o);
      if (!seen.has(k)) seen.set(k, { ...o, week: id });
    }
  }
  return [...seen.values()];
}

function tinTabs() {
  const box = Object.entries(S.box).map(([k, r]) => ({ ...r, key: k }));
  const counts = {};
  box.forEach(r => { const c = r.cuisine || "Other"; counts[c] = (counts[c] || 0) + 1; });
  const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
  const tabs = [{ id: "all", label: "All", cards: box }];
  top.slice(0, 4).forEach(c => tabs.push({ id: "c:" + c, label: c, cards: box.filter(r => (r.cuisine || "Other") === c) }));
  const quick = box.filter(r => Number(r.minutes) && Number(r.minutes) <= 25);
  if (quick.length) tabs.push({ id: "quick", label: "Quick", cards: quick });
  const never = Object.entries(S.rejects).map(([k, r]) => ({ ...r, key: k, torn: true }));
  if (never.length) tabs.push({ id: "never", label: "Never", cards: never, never: true });
  tabs.forEach(t => t.cards.sort((a, b) => (b.pending ? 1 : 0) - (a.pending ? 1 : 0) || String(a.dish).localeCompare(String(b.dish))));
  return tabs;
}

    extra: card ? "" : `<div class="filters" role="group" aria-label="Filter">${tabs.map(t => `<button data-act="tintab" data-v="${esc(t.id)}" aria-pressed="${t.id === tab.id}">${esc(t.label)}</button>`).join("")}</div>` });
  if (card) return [mast, renderTinCard(card, dis)];

      <button class="heart" data-act="heartrec" data-key="${esc(k)}" aria-pressed="${hearted}" aria-label="${hearted ? "Take out of" : "Put in"} the tin" ${dis}>${hearted ? ICON.heart : ICON.heartLine}</button></div>`;

      <button class="primary" ${dis}>Add it ${ICON.arrow}</button></form>` : "";
  const body = `${add}${renderShared()}

function renderTinCard(card, dis) {

    h += `<div class="k">Cook it the week of ${esc(shortDate(S.weekId || thisMonday()))}. It replaces what's planned.</div><div class="nights7">${S.weekId ? SLOTS.map(sl => `<button data-act="tincook" data-slot="${sl}" ${dis}>${DAY[sl].slice(0, 3)}<br>${dayNum(slotDate(sl))}</button>`).join("") : ""}</div><div class="btns"><button class="ghost" data-act="tin" data-v="unpick">Never mind</button></div>`;
