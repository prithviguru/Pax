</div>
<div class="marquee gutter" id="marquee">Pax ✶ dinners for two ✶ Pax ✶ dinners for two</div>
<header class="top gutter">
  <h1 class="wordmark">Pax</h1>
  <nav class="tabs" aria-label="Sections">
    <button id="tab-tonight" data-tab="tonight">Week</button>
    <button id="tab-list" data-tab="list">List</button>
    <button id="tab-recipes" data-tab="recipes">Recipes</button>
  </nav>
</header>
<main class="gutter">
  <div id="banner" class="banner" hidden></div>
  <div id="view"><p class="empty">Getting this week's dinners…</p></div>
</main>
<p class="whoami gutter"><span id="whoami"></span> <button class="ink" data-act="signout">Not you? Switch</button></p>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="pax-db.js"></script>
<script>
const SLOTS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const DAY = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday", sun: "Sunday" };
const COOK = { prithvi: "Prithvi", nihal: "Nihal" };
const OTHER = { prithvi: "nihal", nihal: "prithvi" };

const S = {
  db: null, user: null, me: null, canWrite: true,
  weeks: {}, weekId: null, nights: {}, checks: {}, rejects: {}, box: {}, inbox: {}, hauls: {}, decks: {}, picks: {}, deck: null, staples: [], requests: {},
  tab: "tonight", focus: null, ui: {}, loaded: false,
  fridgeOpen: false, tipSeen: false, tin: { tab: null, card: null, up: false, flipped: false, picking: false },
};
// Per-viewer conveniences only: the fridge stays open for the session, and the handle tip shows once per phone.
function store(kind, key, val) { try { const st = kind === "session" ? sessionStorage : localStorage; if (val === undefined) return st.getItem(key); st.setItem(key, val); } catch (_) { return null; } }
S.fridgeOpen = store("session", "pax-fridge-open") === "1";
S.tipSeen = store("local", "pax-fridge-tip") === "1";
let unsubWeek = [];

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeLink = u => /^https:\/\//i.test(u || "") ? u : "";
const slug = s => String(s || "").toLowerCase().replace(/^https?:\/\//, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 150) || "x";
const recipeKey = r => slug(r.link || r.dish);
const norm = s => String(s || "").trim().toLowerCase();
function localISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); return localISO(new Date(y, m - 1, d + n)); }
function shortDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
const dayNum = iso => String(Number(iso.slice(8)));
const today = () => localISO(new Date());
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }
function stamp() { return { by: S.myName || null, at: new Date().toISOString() }; }
function fmtTime(t) { if (!t) return ""; const [h, m] = t.split(":").map(Number); return ((h % 12) || 12) + (m ? ":" + String(m).padStart(2, "0") : "") + (h >= 12 ? "pm" : "am"); }

async function write(fn, okMsg) {
  if (!S.db) { toast("Pax is still loading. Try again in a moment."); return; }
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) {
    console.error(e);
    if (e && (e.code === "42501" || /row-level security/i.test(e.message || ""))) toast("Pax didn't accept that change. Try again in a moment.");
    else toast("That didn't save. Check your connection and try again.");
  }
}

/* ---------- derived state ---------- */
const week = () => S.weeks[S.weekId] || null;
function slotDate(slot) { return addDays(S.weekId, SLOTS.indexOf(slot)); }
// Plan kinds: cook, out, order, flex ("skip" from older plans reads as out). A night's flag overrides the plan.
const planKind = k => k === "skip" ? "out" : (k || "flex");
const flagMode = f => f === "skip" ? "out" : f;

function nightView(slot) {
  const w = week() || {};
  let plan = (w.nights || {})[slot] || { kind: "flex" };
  let picking = null;
  // A cook night dealt as a Sunday deck has no options until its cook picks. After the deadline, Claude's picks stand in.
  if (planKind(plan.kind) === "cook" && !(plan.options || []).length && plan.cook && deckNights(S.weekId, plan.cook).includes(slot)) {
    if (deckPast(S.weekId)) { const f = autoFill(S.weekId, plan.cook)[slot]; if (f) plan = { ...plan, options: [{ ...f.card, auto: true }, ...f.backups] }; }
    else picking = plan.cook;
  }
  const st = S.nights[slot] || {};
  const pk = planKind(plan.kind);
  const mode = flagMode(st.flag) || pk;
  const cook = st.cook || plan.cook || null;
  const rejected = new Set(st.rejected || []);
  const opts = (plan.options || []).filter(o => !rejected.has(o.id) && !S.rejects[recipeKey(o)]);
  let current = null;
  if (st.boxPick && !S.rejects[recipeKey(st.boxPick)]) current = { ...st.boxPick, fromBox: true };
  else current = opts.find(o => o.id === st.current) || opts[0] || null;
  const backups = opts.filter(o => !current || o.id !== current.id);
  const request = Object.values(S.requests).find(r => r.week === S.weekId && r.slot === slot && r.status === "open");
  return { slot, date: slotDate(slot), plan, st, pk, mode, cook, current, backups, request, picking };
}

function noteText(n) {
  if (n.mode === "cook") {
    if (n.current && n.current.pending) return { title: n.current.dish, sub: `From ${n.current.source || "a link"}${n.current.savedBy ? " ✶ saved by " + n.current.savedBy : ""}` };
    if (n.current) return { title: n.current.dish, sub: [n.current.minutes ? n.current.minutes + " min" : "", n.current.cuisine].filter(Boolean).join(" ✶ ") };
    if (n.picking) return n.picking === myKey() ? { title: "Your pick", sub: "Heart it in your Sunday picks" } : { title: `${COOK[n.picking]}'s picking`, sub: "From the Sunday deck" };
    return { title: "Nothing yet", sub: "Pick from the recipe box or ask Claude" };
  }
  if (n.mode === "flex") return { title: n.plan.label || "Free night", sub: n.plan.note || "Out, in, or leftovers" };
  const planned = n.pk === n.mode;
  const title = planned && n.plan.label ? n.plan.label : (n.mode === "order" ? "Ordering in" : "Eating out");
  const sub = n.current && n.pk === "cook" ? n.current.dish + " is off the list" : (planned ? n.plan.note || "" : "");
  return { title, sub };
}

/* ---------- Sunday decks ---------- */
// decks/<week>: { deadline, lean: {mon: "asian"|"other"}, people: {prithvi: {nights: [...], cards: [...]}} }
// decks/<week>/picks/<person>: { pos, hearts, never, skipped, auto, done, slots }
const ASIAN = ["asian", "chinese", "indo-chinese", "sichuan", "hunan", "korean", "thai", "japanese", "vietnamese", "taiwanese", "malaysian", "indonesian", "filipino"];
const isAsian = c => c.asian ?? ASIAN.includes(norm(c.cuisine));
const myKey = () => norm(S.myName);
const deckFor = w => S.decks[w] || null;
const picksFor = (w, p) => (S.picks[w] || {})[p] || {};
const deckPerson = (w, p) => ((deckFor(w) || {}).people || {})[p] || null;
const deckNights = (w, p) => (deckPerson(w, p) || {}).nights || [];
const deckCards = (w, p) => ((deckPerson(w, p) || {}).cards || []).filter(c => !S.rejects[recipeKey(c)]);
function deckPast(w) { const d = deckFor(w); return !!(d && d.deadline && Date.now() > Date.parse(d.deadline)); }
// Line dishes up with nights so Asian ones land on the week's Asian nights where they can.
function bestOrder(cards, nights, lean) {
  const perms = a => a.length <= 1 ? [a] : a.flatMap((x, i) => perms([...a.slice(0, i), ...a.slice(i + 1)]).map(p => [x, ...p]));
  let best = cards, score = -1;
  for (const p of perms(cards)) {
    const sc = p.reduce((n, c, i) => n + ((lean || {})[nights[i]] ? (isAsian(c) === (lean[nights[i]] === "asian") ? 1 : 0) : 0), 0);
    if (sc > score) { best = p; score = sc; }
  }
  return best;
}
// Backups for each night: the rest of the deck, minus anything marked never, matching the pick's style first.
function deckBackups(order, avail) {
  const left = [...avail];
  return order.map(pick => {
    const mine = [...left.filter(c => isAsian(c) === isAsian(pick)), ...left.filter(c => isAsian(c) !== isAsian(pick))].slice(0, 2);
    mine.forEach(c => left.splice(left.indexOf(c), 1));
    return mine;
  });
}
// What a cook gets if the deadline passes: their hearts, then the deck's top cards for each night's style.
function autoFill(w, p) {
  const pk = picksFor(w, p), cards = deckCards(w, p), nights = deckNights(w, p), lean = (deckFor(w) || {}).lean || {};
  const never = new Set(pk.never || []);
  const avail = cards.filter(c => !never.has(c.id));
  const chosen = avail.filter(c => (pk.hearts || []).includes(c.id)).slice(0, nights.length);
  for (const sl of nights.slice(chosen.length)) {
    const rest = avail.filter(c => !chosen.includes(c));
    const c = rest.find(c => !lean[sl] || isAsian(c) === (lean[sl] === "asian")) || rest[0];
    if (c) chosen.push(c);
  }
  const order = bestOrder(chosen, nights, lean);
  const backups = deckBackups(order, avail.filter(c => !chosen.includes(c)));
  return Object.fromEntries(nights.map((sl, i) => [sl, order[i] ? { card: order[i], backups: backups[i] } : null]));
}
function openDeckWeek() {
  const me = myKey();
  return Object.keys(S.decks).sort().find(w => addDays(w, 6) >= today() && deckNights(w, me).length && deckCards(w, me).length && !picksFor(w, me).done && !deckPast(w)) || null;
}

function chooseWeek() {
  const ids = Object.keys(S.weeks).sort();
  if (!ids.length) return null;
  const t = today();
  return ids.find(id => id <= t && t <= addDays(id, 6)) || ids.find(id => id > t) || ids[ids.length - 1];
}
// The next seven nights, tonight first: where "Add a recipe" (and the Shortcut) can put a dish.
function upcomingNights() {
  return Array.from({ length: 7 }, (_, i) => { const date = addDays(today(), i); return { date, label: (i === 0 ? "Tonight, " : "") + new Date(date + "T12:00").toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" }) }; });
}
const mondayOf = iso => { const d = new Date(iso + "T12:00"); return addDays(iso, -((d.getDay() + 6) % 7)); };
const siteOf = u => /tiktok\.com/i.test(u) ? "TikTok" : /instagram\.com/i.test(u) ? "Instagram" : u ? "the web" : "";
function thisMonday() { const d = new Date(); return addDays(today(), -((d.getDay() + 6) % 7)); }
function weekLabel(id) {
  const diff = Math.round((new Date(id) - new Date(thisMonday())) / 864e5 / 7);
  return diff === 0 ? "This week" : diff === 1 ? "Next week" : diff === -1 ? "Last week" : "Week of " + shortDate(id);
}

/* ---------- render ---------- */
function showBanner() {
  const b = document.getElementById("banner");
  if (S.offline) { b.textContent = "You're offline. Showing the plan as it was; changes will save once you're back online."; b.hidden = false; }
  else b.hidden = true;
}

function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  const w = week();
  document.getElementById("marquee").textContent = S.deck ? `Week of ${shortDate(S.deck.week)} ✶ Sunday picks` : S.weekId ? `Week of ${shortDate(S.weekId)} ✶ ${w && w.note ? w.note.split(". ")[0].split(",")[0].replace(/\.$/, "") : "dinners for two"}` : "Pax ✶ dinners for two";
  if (!S.loaded) return;
  const v = document.getElementById("view");
  v.innerHTML = S.deck ? renderDeck() : S.tab === "list" ? renderList() : S.tab === "recipes" ? renderRecipes() : renderWeekView();
  resolveNames();
}

function noWeek() {
  return `<div class="shelf"><h2>Nothing on the fridge yet</h2><p class="empty">Claude plans each week on Sunday afternoon: a dish for every cook night with two backups, and a note for nights you're out. It'll show up here.</p></div>`;
}

function deckBanner() {
  const w = openDeckWeek(); if (!w) return "";
  const me = myKey(), nights = deckNights(w, me), n = deckCards(w, me).length, pk = picksFor(w, me);
  const started = (pk.pos || 0) > 0;
  return `<button class="deckcta" data-act="deck" data-v="${w}"><span class="k">Your Sunday picks ✶ week of ${esc(shortDate(w))}</span><b>${n} dishes. Heart ${nights.length} for ${esc(nights.map(sl => DAY[sl].slice(0, 3)).join(" and "))}.</b><span>${started ? "Pick up where you left off →" : "Takes about a minute →"}</span></button>`;
}

function renderWeekView() {
  if (!S.weekId) return deckBanner() || noWeek();
  return `<div style="display:grid;gap:72px"><div style="display:grid;gap:22px">${deckBanner()}${renderWeek()}</div>${S.focus ? renderOpen(nightView(S.focus)) : ""}</div>`;
}

function renderWeek() {
  const w = week();
  const dis = S.canWrite ? "" : "disabled";
  // Unplanned weeks still open, so a link saved to next week shows up before Claude plans it.
  const deckNote = deckFor(S.weekId) && !deckPast(S.weekId) ? Object.keys(deckFor(S.weekId).people || {}).filter(p => p !== myKey()).map(p => { const pk = picksFor(S.weekId, p); return pk.done ? `${COOK[p] || p} has picked.` : `${COOK[p] || p}: ${Math.min((pk.hearts || []).length, deckNights(S.weekId, p).length)} of ${deckNights(S.weekId, p).length} picked.`; }).join(" ") : "";
  const note = w ? [w.note, deckNote].filter(Boolean).join(" ") : addDays(S.weekId, 6) < today() ? "Nothing was planned this week." : "Not planned yet. Claude plans each week the Sunday before; anything you put on a night here stays.";
  let h = `<section aria-labelledby="week-h"><div class="weekhead"><div><h2 id="week-h">${esc(weekLabel(S.weekId))}</h2>${note ? `<p>${esc(note)}</p>` : ""}</div>
    <div class="print" style="display:flex;gap:20px"><button class="ink" data-act="week" data-v="${addDays(S.weekId, -7)}">← last</button><button class="ink" data-act="week" data-v="${addDays(S.weekId, 7)}">next →</button></div></div><div class="cal">`;
  const t = today();
  for (const slot of SLOTS) {
    const n = nightView(slot);
    const away = n.mode === "out" || n.mode === "order";
    const { title, sub } = noteText(n);
    const label = `${DAY[slot]} ${shortDate(n.date)}: ${title}${sub ? ". " + sub : ""}`;
    h += `<div class="day"><div class="note-wrap"><span class="tape" aria-hidden="true"></span>
      <button class="note${away ? " away" : ""}${n.date === t ? " today" : ""}" data-act="focus" data-slot="${slot}" aria-pressed="${S.focus === slot}" aria-label="${esc(label)}">
        <span class="dow">${DAY[slot].slice(0, 3)}<b>${dayNum(n.date)}</b></span>
        <span class="num">${dayNum(n.date)}</span>
        <span class="title">${esc(title)}</span>
        ${sub ? `<span class="sub">${esc(sub)}</span>` : ""}
        ${away ? `<span class="stamp" aria-hidden="true">${n.mode === "order" ? "order in" : "out"}</span>` : (n.cook && n.mode === "cook" ? `<span class="who-tag">${esc(COOK[n.cook])}</span>` : "")}
      </button></div>
      <div class="daybtns">${away
        ? `<button class="label" data-act="flag" data-slot="${slot}" data-v="cook" ${dis}>We're cooking after all</button>`
        : `<button class="label" data-act="flag" data-slot="${slot}" data-v="order" ${dis}>We're ordering in</button><button class="label" data-act="flag" data-slot="${slot}" data-v="out" ${dis}>We're eating out</button>`}</div></div>`;
  }
  return h + `</div></section>`;
}

function renderOpen(n) {
  const dis = S.canWrite ? "" : "disabled";
  const ui = S.ui[n.slot] || {};
  const time = n.plan.time ? fmtTime(n.plan.time) : "";
  const c = n.mode === "cook" ? n.current : null;
  let sheet = `<span class="kick">${esc(DAY[n.slot])}, ${esc(shortDate(n.date))}${time && c ? " ✶ " + esc(time) : ""}</span>`;
  const awayNow = n.mode === "out" || n.mode === "order";
  const inout = `<div class="openbtns">${awayNow ? `<button class="label" style="grid-column:1/-1" data-act="flag" data-slot="${n.slot}" data-v="cook" ${dis}>We're cooking after all</button>` : `<button class="label" data-act="flag" data-slot="${n.slot}" data-v="order" ${dis}>We're ordering in</button><button class="label" data-act="flag" data-slot="${n.slot}" data-v="out" ${dis}>We're eating out</button>`}</div>`;
  let receipt = "";

  if (n.mode !== "cook") {
    const { title, sub } = noteText(n);
    sheet += `<h2 id="open-h">${esc(title)}</h2>`;
    if (sub) sheet += `<p class="tweak">${esc(sub)}</p>`;
    if (n.mode === "flex") sheet += renderBoxPicker(n, dis, true);
    if (n.st.flag && n.st.by) sheet += `<p class="tweak" data-by="${esc(n.st.by)}">Marked by <span class="name">someone</span>.</p>`;
    receipt = `<p style="margin:10px 0 0;font-size:17px">Nothing to shop for. This night is off the list.</p>`;
  } else if (!c && n.picking) {
    const mine = n.picking === myKey();
    sheet += `<h2 id="open-h">${mine ? "Your pick" : esc(COOK[n.picking]) + " is picking"}</h2><p class="tweak">${mine ? "Heart a dish in your Sunday picks and it lands here." : `This night comes from ${esc(COOK[n.picking])}'s Sunday deck. If nothing's picked by the deadline, Claude's top pick goes on.`}</p>`;
    if (mine) sheet += `<button class="label" data-act="deck" data-v="${S.weekId}">Open your Sunday picks</button>`;
    receipt = `<p style="margin:10px 0 0;font-size:17px">The dish's ingredients show up once it's picked.</p>`;
  } else if (!c) {
    sheet += `<h2 id="open-h">Nothing left for ${esc(DAY[n.slot])}</h2><p class="tweak">${(n.plan.options || []).length ? "Both backups are gone." : "Nothing was planned for this night."} Pick something from your recipe box, or ask Claude for two new options.</p>`;
    sheet += renderBoxPicker(n, dis, false) + renderRequest(n, dis);
    receipt = `<p style="margin:10px 0 0;font-size:17px">Pick a dish and its ingredients show up here.</p>`;
  } else {
    const link = safeLink(c.link);
    const hearted = !!S.box[recipeKey(c)];
    sheet += `<h2 id="open-h">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(c.dish)}</a>` : esc(c.dish)}</h2>
      <span class="src">${esc([c.source, c.minutes && c.minutes + " min", c.cuisine, c.fromBox && "from your recipe box"].filter(Boolean).join(", "))}</span>
      <div class="cookline"><span class="who">${esc(COOK[n.cook] || "Whoever's home")} cooks</span>
        ${n.cook ? `<button class="ink" data-act="cook" data-slot="${n.slot}" ${dis}>Hand to ${esc(COOK[OTHER[n.cook]])}</button>` : ""}
        <button class="heart" data-act="heart" data-slot="${n.slot}" aria-pressed="${hearted}" aria-label="${hearted ? "Remove from" : "Save to"} recipe box" ${dis}>${hearted ? "♥" : "♡"}</button></div>
      ${c.protein || c.carb || c.veg ? `<div class="tags"><span>Protein: ${esc(c.protein)}</span><span>Carb: ${esc(c.carb)}</span><span>Veg: ${esc(c.veg)}</span></div>` : ""}`;
    if (c.pending) sheet += `<p class="tweak">Saved from ${esc(c.source || "a link")}${c.savedBy ? " by " + esc(c.savedBy) : ""}. Claude will read the caption and fill in the dish, protein, carb, veg and ingredients the next time it runs.</p>
      <form class="addrow" id="rename-form" data-slot="${n.slot}"><input type="text" id="rename-input" aria-label="Dish name" placeholder="Name it, e.g. pumpkin pasta" ${dis}><button ${dis}>Save name</button></form>`;
    if (c.tweak) sheet += `<p class="tweak">${esc(c.tweak)}</p>`;
    if (!link && (c.steps || []).length) sheet += `<ol class="steps">${c.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`;
    if (ui.mode === "swap") {
      sheet += `<div class="options">${n.backups.map(o => `<button class="option" data-act="pick" data-slot="${n.slot}" data-id="${esc(o.id)}" ${dis}><b>${esc(o.dish)}</b><span>${esc([o.source, o.minutes && o.minutes + " min", o.protein].filter(Boolean).join(", "))}</span></button>`).join("") || `<p class="tweak">No backups left for this night.</p>`}</div>`;
      sheet += renderBoxPicker(n, dis, true);
      sheet += `<div class="actions"><button class="ink" data-act="ui" data-slot="${n.slot}" data-v="">Keep ${esc(c.dish)}</button></div>`;
    } else if (ui.mode === "reject") {
      sheet += `<div class="confirm actions"><span>Never suggest ${esc(c.dish)} again?</span><button class="ink" data-act="reject" data-slot="${n.slot}" ${dis}>Yes, reject it</button><button class="ink" data-act="ui" data-slot="${n.slot}" data-v="">Cancel</button></div>`;
    } else {
      sheet += `<div class="actions">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener" style="font-size:20px">${c.source === "TikTok" || c.source === "Instagram" ? "Open on " + esc(c.source) : "Open the recipe"} →</a>` : ""}
        <button class="ink" data-act="ui" data-slot="${n.slot}" data-v="swap" ${dis}>Swap${n.backups.length ? ` (${n.backups.length})` : ""}</button>
        <button class="ink" data-act="ui" data-slot="${n.slot}" data-v="reject" ${dis}>Reject</button></div>`;
    }
    if (n.st.by && (n.st.current || n.st.boxPick || (n.st.rejected || []).length || n.st.cook)) sheet += `<p class="tweak" data-by="${esc(n.st.by)}">Last changed by <span class="name">someone</span>.</p>`;
    receipt = (c.ingredients || []).length ? `<ul>${c.ingredients.map(i => `<li>${esc(i)}</li>`).join("")}</ul><p style="margin:10px 0 0;font-size:14px">Quantities are on the recipe page.</p>` : `<p style="margin:10px 0 0;font-size:17px">No ingredient list for this one.</p>`;
  }
  sheet = sheet.replace("</h2>", "</h2>" + inout);
  return `<section class="open" id="open" aria-labelledby="open-h"><span class="bigstamp" aria-hidden="true">${esc(DAY[n.slot])}</span><button class="ink closer" data-act="close">Close ✕</button>
    <div class="split"><div class="sheet">${sheet}</div><aside class="receipt" aria-label="What goes in it"><div class="rhead">What goes in it</div>${receipt}</aside></div></section>`;
}

function renderBoxPicker(n, dis, compact) {
  const items = Object.values(S.box).filter(b => !S.rejects[recipeKey(b)]);
  if (!items.length) return compact ? "" : `<p class="tweak">Your recipe box is empty. Tap ♡ on a dish you liked to save it.</p>`;
  return `<details ${compact ? "" : "open"}><summary class="print" style="cursor:pointer;font-size:16px">${n.mode === "flex" ? "Cook something from your recipe box" : "From your recipe box"}</summary><div class="options" style="margin-top:8px">${items.map(b =>
    `<button class="option" data-act="boxpick" data-slot="${n.slot}" data-key="${esc(recipeKey(b))}" ${dis}><b>${esc(b.dish)}</b><span>${esc([b.source, b.minutes && b.minutes + " min", b.protein].filter(Boolean).join(", "))}</span></button>`).join("")}</div></details>`;
}

function renderRequest(n, dis) {
  if (n.request) return `<p class="tweak">You asked Claude for new options${n.request.note ? `: “${esc(n.request.note)}”` : ""}. They'll show up here after Claude's next run.</p>`;
  return `<div style="display:grid;gap:8px"><label for="req-${n.slot}" class="print" style="font-size:15px;text-transform:uppercase">Anything Claude should know?</label>
    <textarea id="req-${n.slot}" rows="2" placeholder="e.g. something with eggs, nothing too heavy"></textarea>
    <div><button class="label" style="width:auto" data-act="request" data-slot="${n.slot}" ${dis}>Ask Claude for new options</button></div></div>`;
}

function buildList() {
  const map = new Map();
  for (const slot of SLOTS) {
    const n = nightView(slot);
    if (n.mode !== "cook" || !n.current) continue;
    for (const raw of n.current.ingredients || []) {
      const k = norm(raw); if (!k) continue;
      if (!map.has(k)) map.set(k, { key: slug(k), name: raw.trim(), dishes: [] });
      map.get(k).dishes.push(DAY[slot].slice(0, 3) + ": " + n.current.dish);
    }
  }
  const staples = new Set(S.staples.map(norm));
  const buy = [], have = [];
  for (const [k, it] of map) (staples.has(k) ? have : buy).push(it);
  const by = (a, b) => a.name.localeCompare(b.name);
  return { buy: buy.sort(by), have: have.sort(by) };
}

const SHELVES = [
  { id: "frozen", label: "Freezer", cls: "freezer", shape: "box" },
  { id: "dairy", label: "Top shelf ✶ dairy and eggs", cls: "", shape: "carton" },
  { id: "pantry", label: "Middle shelf ✶ jars, cans, bread", cls: "", shape: "jar" },
  { id: "produce", label: "Crisper drawer ✶ produce", cls: "drawer", shape: "bag" },
];
// The planner tags each ingredient with a shelf (week.shelves); this guesses for anything it missed.
const GUESS = {
  frozen: ["frozen"],
  dairy: ["paneer", "feta", "parmesan", "cheese", "cheddar", "monterey", "mozzarella", "ricotta", "cream", "milk", "yogurt", "curd", "butter", "ghee", "egg"],
  produce: ["avocado", "cilantro", "rosemary", "chili", "lemon", "lime", "cabbage", "spinach", "tomato", "kale", "broccoli", "scallion", "onion", "garlic", "ginger", "mint", "arugula", "basil", "carrot", "potato", "cucumber", "zucchini", "mushroom", "pepper", "herb", "parsley", "dill", "greens", "lettuce", "curry leaves", "cauliflower", "eggplant", "squash", "peas"],
};
const PANTRY = ["chickpea", "bean", "lentil", "dal", "tortilla", "pasta", "ditalini", "orzo", "noodle", "rice", "roti", "naan", "bread", "salsa", "broth", "paste", "sauce", "vinegar", "oil", "sugar", "flour", "coconut milk", "cashew", "nut", "chili crisp", "sesame seed", "spice", "masala", "powder", "seeds"];
function shelfOf(name) {
  const n = norm(name), w = week() || {};
  const tagged = (w.shelves || {})[n];
  if (tagged && SHELVES.some(x => x.id === tagged)) return tagged;
  if (GUESS.frozen.some(g => n.includes(g))) return "frozen";
  if (PANTRY.some(g => n.includes(g))) return "pantry";
  for (const id of ["dairy", "produce"]) if (GUESS[id].some(g => n.includes(g))) return id;
  return "pantry";
}

// Grocery hauls the planner read from DoorDash receipts (hauls/<order>). Fresh things count as
// "in the fridge" for a week (frozen for a month); shelf-stable things go to staples instead.
function recentHaul() {
  const out = new Map(), t = today();
  for (const h of Object.values(S.hauls)) {
    if (!h || !h.date) continue;
    for (const it of h.items || []) {
      if (!it || !it.name || it.keep === "pantry" || it.keep === "skip") continue;
      if (addDays(h.date, it.shelf === "frozen" ? 30 : 7) < t) continue;
      const key = slug(norm(it.name));
      if (!out.has(key) || out.get(key).date < h.date) out.set(key, { key, name: it.name, shelf: it.shelf, date: h.date, store: h.store || "" });
    }
  }
  return out;
}
// Ticked by hand wins; otherwise anything in a recent haul counts as got.
function isGot(key) { const items = S.checks.items || {}; return key in items ? !!items[key] : recentHaul().has(key); }

function renderList() {
  if (!S.weekId) return noWeek();
  const { buy, have } = buildList();
  const dis = S.canWrite ? "" : "disabled";
  const haul = recentHaul();
  const checks = Object.fromEntries(buy.map(i => [i.key, isGot(i.key)]));
  const left = buy.filter(i => !checks[i.key]).length;
  const listed = new Set([...buy, ...have].map(i => i.key));
  const extras = [...haul.values()].filter(h => !listed.has(h.key));
  const thing = (it, shape) => `<button class="thing ${shape}${checks[it.key] ? " got" : ""}" data-act="tick" data-key="${esc(it.key)}" aria-pressed="${!!checks[it.key]}" title="${esc(it.dishes.join(" · "))}" ${dis}><span>${esc(it.name)}</span></button>`;
  const stocked = (h, shape) => `<span class="thing ${shape} stocked" title="${esc(`From ${h.store || "your order"}, ${shortDate(h.date)}`)}"><span>${esc(h.name)}</span></span>`;
  const shelf = sh => {
    const items = buy.filter(i => shelfOf(i.name) === sh.id);
    const inside = extras.filter(h => (SHELVES.some(x => x.id === h.shelf) ? h.shelf : shelfOf(h.name)) === sh.id);
    return `<section class="compart ${sh.cls}" aria-label="${esc(sh.label)}">${sh.id === "frozen" ? `<span class="bottle" aria-hidden="true"></span>` : ""}<span>${esc(sh.label)}</span>${items.length ? `<div class="shelfrow">${items.map(i => thing(i, sh.shape)).join("")}</div>` : `<p class="none" style="margin:0">Nothing to buy here.</p>`}${inside.length ? `<span class="stockedlabel">Already in here</span><div class="shelfrow">${inside.map(h => stocked(h, sh.shape)).join("")}</div>` : ""}</section>`;
  };
  let inside = SHELVES.filter(x => x.id !== "produce").map(shelf).join("");
  inside += `<section class="compart have" aria-label="Already have"><span>Bottom shelf ✶ already have</span>${have.length ? `<div class="shelfrow">${have.map(i => thing(i, "staple")).join("")}</div>` : `<p class="none" style="margin:0">None of this week's ingredients are staples.</p>`}</section>`;
  inside += shelf(SHELVES.find(x => x.id === "produce"));
  const open = S.fridgeOpen;
  const door = `<div class="door${open ? " open" : ""}" ${open ? "inert" : ""}><div class="door-face">
      <div class="panel fz"><button class="handle" data-act="fridge" data-v="open" aria-label="Open the fridge" style="top:30px;height:66px"></button></div>
      <div class="panel main"><button class="handle" data-act="fridge" data-v="open" aria-label="Open the fridge" style="top:22px;height:110px"></button>${!open && !S.tipSeen ? `<span class="tip" aria-hidden="true" style="top:144px">pull to open</span>` : ""}
      <div class="doornote"><span class="magnet" aria-hidden="true"></span><b>Groceries inside!</b>${left ? `${left} thing${left > 1 ? "s" : ""} to buy` : "Got everything"}<br>${have.length} staple${have.length === 1 ? "" : "s"} on the bottom shelf${extras.length ? `<br>${extras.length} more from your last order` : ""}</div></div>
    </div></div>`;
  const tip = "";
  return `<div style="display:grid;gap:22px">
    <div class="shelf"><h2>The list</h2><p class="empty" style="margin:0">Everything for the week of ${esc(shortDate(S.weekId))}, built from the dishes you're cooking. Swap a dish or mark a night as out and the fridge restocks itself. Quantities are on the recipe pages.</p></div>
    <div class="fridge${open ? "" : " shut"}"><div class="inside" ${open ? "" : "inert"}>${inside}</div>${tip}${door}</div>
    ${open ? `<div class="fridgebar"><span>${left ? `${left} left to buy. Tap anything you've got.` : "Got everything."}</span><button class="ink" data-act="fridge" data-v="close">Close the fridge</button></div>` : ""}
    <details id="staples-box" style="max-width:350px" ${S.staplesOpen ? "open" : ""}><summary class="print" style="cursor:pointer;font-size:16px">Change what's on the bottom shelf</summary>
      <p class="empty" style="margin:8px 0">Staples always land on the bottom shelf. Tap one to take it off.</p>
      <div class="chips">${S.staples.map(x => `<button class="chip" data-act="unstaple" data-name="${esc(x)}" aria-label="Remove ${esc(x)}" ${dis}>${esc(x)} ×</button>`).join("") || `<span class="empty">No staples yet.</span>`}</div>
      <form class="addrow" id="staple-form"><input type="text" id="staple-input" placeholder="Add a staple, e.g. basmati rice" ${dis}><button ${dis}>Add</button></form>
      ${buy.length ? `<p class="empty" style="margin:12px 0 6px">Or move something from this week into staples:</p><div class="chips">${buy.map(i => `<button class="chip" data-act="staple" data-name="${esc(i.name)}" ${dis}>+ ${esc(i.name)}</button>`).join("")}</div>` : ""}
    </details></div>`;
}

function allPlanned() {
  const seen = new Map();
  for (const id of Object.keys(S.weeks).sort().reverse()) {
    const w = S.weeks[id];
    for (const slot of SLOTS) for (const o of ((w.nights || {})[slot] || {}).options || []) {
      const k = recipeKey(o);
      if (!seen.has(k)) seen.set(k, { ...o, week: id });
    }
  }
  return [...seen.values()];
}

function tinTabs() {
  const box = Object.entries(S.box).map(([k, r]) => ({ ...r, key: k }));
  const counts = {};
  box.forEach(r => { const c = r.cuisine || "Other"; counts[c] = (counts[c] || 0) + 1; });
  const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
  const named = top.slice(0, 3), rest = top.slice(3);
  const tabs = named.map(c => ({ id: "c:" + c, label: c.length > 8 ? c.slice(0, 7) + "." : c, cards: box.filter(r => (r.cuisine || "Other") === c) }));
  if (rest.length) tabs.push({ id: "other", label: "Other", cards: box.filter(r => rest.includes(r.cuisine || "Other")) });
  const quick = box.filter(r => Number(r.minutes) && Number(r.minutes) <= 25);
  if (quick.length) tabs.push({ id: "quick", label: "Quick", cards: quick });
  const never = Object.entries(S.rejects).map(([k, r]) => ({ ...r, key: k, torn: true }));
  if (never.length) tabs.push({ id: "never", label: "Never", cards: never, never: true });
  tabs.forEach(t => t.cards.sort((a, b) => a.dish.localeCompare(b.dish)));
  return tabs;
}

function renderRecipes() {
  const dis = S.canWrite ? "" : "disabled";
  const tabs = tinTabs();
  if (!S.tin.tab && tabs.length) S.tin = { ...S.tin, tab: tabs[0].id };
  const T = S.tin;
  const tab = tabs.find(t => t.id === T.tab) || null;
  const all = tabs.flatMap(t => t.cards);
  const card = T.card ? all.find(c => c.key === T.card && (c.torn ? T.tab === "never" : true)) : null;
  let stage = `<div class="lid" aria-hidden="true"></div>`;
  if (!tabs.length) stage += `<div class="tinprompt"><b>The tin is empty</b><span>Tap ♡ on a dinner you loved and it gets a card in here.</span></div>`;
  else if (!T.up && !tab) stage += `<div class="tinprompt"><b>What are we making?</b><span>Tap a divider to flip through the cards behind it.</span></div>`;
  if (tab && !T.up) {
    const n = tab.cards.length, gap = Math.min(52, Math.floor(420 / Math.max(n, 1)));
    tab.cards.forEach((c, i) => {
      stage += `<button class="strip${c.torn ? " torn" : ""}" data-act="tincard" data-key="${esc(c.key)}" style="bottom:${166 + (n - 1 - i) * gap}px">${esc(c.dish)}<small>${c.torn ? "never again" : esc(c.minutes ? c.minutes + " min" : (c.source || ""))}</small></button>`;
    });
  }
  let faces = "";
  if (card && card.torn) {
    faces = `<div class="face torn"><span class="kick">Torn out</span><span class="dish">${esc(card.dish)}</span><span class="meta">${esc(card.source || "")}</span>
      <span class="meta" style="margin-top:8px">Claude won't suggest this one again. Changed your mind?</span>
      <div class="foot"><button class="ink" data-act="unreject" data-key="${esc(card.key)}" ${dis}>Tape it back in</button><button class="ink" data-act="tin" data-v="putback">Put it back</button></div></div>`;
  } else if (card) {
    const link = safeLink(card.link);
    const front = T.picking
      ? `<span class="kick">Cook it the week of ${esc(shortDate(S.weekId || today()))}</span><span class="dish" style="font-size:44px">${esc(card.dish)}</span><span class="meta">Which night? It replaces whatever's planned and goes on the list.</span>
         <div class="nights">${S.weekId ? SLOTS.map(sl => `<button data-act="tincook" data-slot="${sl}" ${dis}>${DAY[sl].slice(0, 3)}<br>${esc(shortDate(slotDate(sl)))}</button>`).join("") : ""}</div>
         <div class="foot"><button class="ink" data-act="tin" data-v="unpick">Never mind</button></div>`
      : `<span class="kick">${esc(card.cuisine || "Saved")} ✶ in the tin</span><span class="dish">${esc(card.dish)}</span><span class="meta">${esc([card.minutes && card.minutes + " min", card.source].filter(Boolean).join(" ✶ "))}</span>
         ${card.protein || card.carb || card.veg ? `<span class="pcv">Protein: ${esc(card.protein || "")}<br>Carb: ${esc(card.carb || "")}<br>Veg: ${esc(card.veg || "")}</span>` : `<span class="meta">Claude will fill in the details from the caption next time it runs.</span>`}
         ${card.pending ? `<form class="addrow" id="tinname-form" data-key="${esc(card.key)}"><input type="text" id="tinname-input" aria-label="Dish name" placeholder="Name it, e.g. pumpkin pasta" ${dis}><button ${dis}>Save</button></form>` : ""}
         ${link && card.tweak ? `<span class="meta clamp3" style="font-size:14px">${esc(card.tweak)}</span>` : ""}
         <div class="foot">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${card.source === "TikTok" || card.source === "Instagram" ? "Open on " + esc(card.source) : "Open the recipe"} →</a>` : `<button class="ink" data-act="tin" data-v="flip">Flip for the steps ↻</button>`}<button class="ink" data-act="tin" data-v="pick" ${S.weekId ? "" : "disabled"} ${dis}>Cook it this week</button></div>
         ${link ? `<button class="ink" style="font-size:14px;align-self:flex-start" data-act="heartrec" data-key="${esc(card.key)}" ${dis}>Take it out of the tin</button>` : ""}`;
    faces = `<div class="face" ${T.flipped ? 'aria-hidden="true"' : ""}>${front}</div>
      <div class="face back" ${T.flipped ? "" : 'aria-hidden="true" inert'}><span class="kick">How to make it</span>
        ${(card.steps || []).length ? `<ol>${card.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : `<span class="meta">The steps are on the recipe page.</span>`}
        ${(card.ingredients || []).length ? `<span class="kick" style="margin-top:6px">What goes in it</span><span class="meta">${esc(card.ingredients.join(", "))}</span>` : ""}
        ${card.tweak ? `<span class="kick" style="margin-top:6px">Notes</span><span class="meta">${esc(card.tweak)}</span>` : ""}
        <div class="foot"><button class="ink" data-act="tin" data-v="flip">Flip back ↻</button></div>
        <button class="ink" style="font-size:14px;align-self:flex-start" data-act="heartrec" data-key="${esc(card.key)}" ${dis}>Take it out of the tin</button></div>`;
  }
  stage += `<div class="slot${T.up && card ? "" : " down"}"><div class="card3d${T.flipped ? " flipped" : ""}">${faces}</div></div>`;
  if (tabs.length) stage += `<div class="dividers" role="group" aria-label="Dividers" style="grid-template-columns:repeat(${tabs.length},minmax(0,1fr))">${tabs.map(t => `<button class="divider${t.never ? " never" : ""}" data-act="tintab" data-v="${esc(t.id)}" aria-pressed="${T.tab === t.id}" aria-label="${esc(t.label)}, ${t.cards.length} card${t.cards.length === 1 ? "" : "s"}"><span class="tab">${esc(t.label)} <b>${t.cards.length}</b></span></button>`).join("")}</div>`;
  stage += `<div class="tin"><span class="clasp" aria-hidden="true"></span><span class="plate">our recipes</span></div>`;
  const nStrips = tab && !T.up ? tab.cards.length : 0;
  const stageH = T.up && card ? 606 : (tabs.length ? 250 + Math.max(0, nStrips - 1) * 52 : 300);

  const rec = r => {
    const link = safeLink(r.link); const k = recipeKey(r); const hearted = !!S.box[k];
    return `<div class="rec"><div class="t">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(r.dish)}</a>` : `<b>${esc(r.dish)}</b>`}<small>${esc([r.source, r.cuisine, r.minutes && r.minutes + " min"].filter(Boolean).join(", "))}</small></div>
      <button class="heart" data-act="heartrec" data-key="${esc(k)}" aria-pressed="${hearted}" aria-label="${hearted ? "Take out of" : "Put in"} the tin" ${dis}>${hearted ? "♥" : "♡"}</button></div>`;
  };
  const planned = allPlanned().filter(r => !S.rejects[recipeKey(r)]);
  return `<div style="display:grid;gap:44px">
    <section class="shelf" aria-label="Recipe tin"><h2>Our recipes</h2><div class="stage" style="height:${stageH}px">${stage}</div>
      <details id="add-box" style="max-width:350px;margin-top:18px" ${S.addOpen ? "open" : ""}><summary class="print" style="cursor:pointer;font-size:16px">Add a recipe</summary>
        <p class="empty" style="margin:8px 0">Paste a link from TikTok, Instagram or a recipe site. Claude fills in the details on its next run.</p>
        <form id="add-form" style="display:grid;gap:8px">
          <input class="field" type="url" id="add-link" placeholder="https://…" aria-label="Link" ${dis}>
          <input class="field" type="text" id="add-name" placeholder="Name it, e.g. pumpkin pasta" aria-label="Dish name" ${dis}>
          <select class="field" id="add-where" aria-label="Where it goes" ${dis}><option value="tin">Just the recipe tin</option>${upcomingNights().map(x => `<option value="${x.date}">${esc(x.label)}</option>`).join("")}</select>
          <button class="field" style="justify-self:start;padding:4px 14px;font-size:18px" ${dis}>Add it</button>
        </form></details>
      ${renderShared()}</section>
    <section class="shelf"><h2>Everything Claude has suggested</h2><p class="empty" style="margin:0 0 6px">Tap ♡ to give one a card in the tin.</p>${planned.map(rec).join("") || `<p class="empty">None yet.</p>`}</section></div>`;
}

// What the "Add to Pax" Shortcut delivered, and where the database filed each one.
function renderShared() {
  const items = Object.entries(S.inbox).map(([id, d]) => ({ id, ...d }));
  const where = d => {
    const m = /^weeks\/(\d{4}-\d{2}-\d{2})\/nights\/(\w+)$/.exec(d.filedTo || "");
    if (m) return { text: `${DAY[m[2]] || m[2]} ${shortDate(addDays(m[1], SLOTS.indexOf(m[2])))}`, week: m[1], slot: m[2] };
    if (/^box\//.test(d.filedTo || "")) return { text: "the recipe tin" };
    return { text: d.status ? `nowhere (${d.status})` : "nowhere yet" };
  };
  const row = d => { const w = where(d); return `<div class="rec"><div class="t"><b>${esc(siteOf(d.url) === "the web" ? (d.url || "").replace(/^https?:\/\//, "").slice(0, 40) : siteOf(d.url) || "No link")}</b><small>${esc(d.by || "Someone")} picked ${esc(d.night || "?")} ✶ went to ${esc(w.text)}</small></div>${w.week ? `<button class="ink" style="font-size:15px" data-act="gonight" data-week="${w.week}" data-slot="${w.slot}">Open</button>` : ""}</div>`; };
  return `<details id="shared-box" style="max-width:420px;margin-top:10px" ${S.sharedOpen ? "open" : ""}><summary class="print" style="cursor:pointer;font-size:16px">Shared from your phones (${items.length})</summary>
    ${items.length ? items.map(row).join("") : `<p class="empty" style="margin:8px 0">Nothing has come through from the Add to Pax Shortcut yet. If you've shared something and it isn't here, the Shortcut's request isn't reaching Pax.</p>`}</details>`;
}

// The Sunday deck: heart as many dishes as you have cook nights, then put them on your nights.
function renderDeck() {
  const D = S.deck, w = D.week, me = myKey(), dis = S.canWrite ? "" : "disabled";
  const cards = deckCards(w, me), nights = deckNights(w, me), need = nights.length;
  const pk = picksFor(w, me), pos = pk.pos || 0;
  const byId = id => cards.find(c => c.id === id);
  const hearts = (pk.hearts || []).map(byId).filter(Boolean);
  const days = nights.map(sl => DAY[sl]).join(" and ");
  const other = Object.keys((deckFor(w) || {}).people || {}).find(p => p !== me);
  const undo = D.history.length ? `<button class="pill dashed" data-act="deckundo">↶ Undo: ${esc(D.history[D.history.length - 1].label)}</button>` : "";
  const row = (sl, c, note) => `<div class="deckrow"><span class="d">${esc(DAY[sl].slice(0, 3))}<b>${dayNum(addDays(w, SLOTS.indexOf(sl)))}</b></span><span><b>${esc(c ? c.dish : "Nothing yet")}</b><small>${esc(note || "")}</small></span></div>`;
  const head = `<p class="kick" style="margin:0">Your Sunday picks ✶ week of ${esc(shortDate(w))}</p>`;
  let body;
  if (!need || !cards.length) {
    body = `<h2>Nothing to pick</h2><p>There's no deck for you this week.</p>`;
  } else if (pk.done) {
    const slots = pk.slots || {};
    body = `<h2>You're set.</h2><p>Your nights are on the week and the grocery list.${other && !picksFor(w, other).done ? ` ${esc(COOK[other])} hasn't picked yet. Anything still open at the deadline gets Claude's top picks.` : ""}</p>
      <div class="deckrows">${nights.map(sl => { const c = byId(slots[sl]); return row(sl, c, c ? [c.cuisine, c.minutes && c.minutes + " min", (pk.auto || []).includes(c.id) ? "Claude's pick" : "You picked it"].filter(Boolean).join(" ✶ ") : ""); }).join("")}</div>
      <button class="pill go" data-act="deckclose">Back to the week</button>`;
  } else if (hearts.length >= need) {
    const order = (D.order || bestOrder(hearts, nights, (deckFor(w) || {}).lean).map(c => c.id)).map(byId);
    D.order = order.map(c => c.id);
    const lean = (deckFor(w) || {}).lean || {};
    const hint = need < 2 ? "" : order.every(isAsian) ? "Both are Asian, so one lands next to another Asian night. Fine if you're craving it." : Object.keys(lean).length ? "The Asian one goes on the week's Asian night, so you don't get two stir-fries in a row. Swap if you'd rather." : "";
    body = `<h2>${need > 1 ? "Which night for which?" : "Put it on the week"}</h2>${hint ? `<p>${esc(hint)}</p>` : ""}
      <div class="deckrows">${nights.map((sl, i) => row(sl, order[i], order[i] ? [order[i].cuisine, order[i].minutes && order[i].minutes + " min", (pk.auto || []).includes(order[i].id) ? "Claude's pick: the deck ran out" : ""].filter(Boolean).join(" ✶ ") : "") + (i < nights.length - 1 ? `<button class="pill small" data-act="deckswap" data-i="${i}" aria-label="Swap ${DAY[sl]} and ${DAY[nights[i + 1]]}">⇅ Swap ${esc(DAY[sl].slice(0, 3))} and ${esc(DAY[nights[i + 1]].slice(0, 3))}</button>` : "")).join("")}</div>
      ${undo}<button class="pill go" data-act="deckok" ${dis}>Put ${need > 1 ? "them" : "it"} on the week</button>`;
  } else if (!D.started && !pos) {
    body = `<h2>${cards.length} dishes. Heart ${need}.</h2>
      <p>You cook ${esc(days)}, so you need ${need}. Heart the ones you'd actually be excited to eat. Once you have ${need}, you'll put them on your nights.</p>
      <p class="small">Not this week skips it; it can come back another week. Never puts it in the tin's Never divider for good.${other ? ` ${esc(COOK[other])} picks for their own nights on their phone.` : ""}</p>
      <button class="pill go" data-act="deckstart">Start</button><button class="pill" data-act="deckclose">Later</button>`;
  } else {
    const c = cards[Math.min(pos, cards.length - 1)];
    const link = safeLink(c.link);
    body = `<div class="deckchips">${nights.map((_, i) => `<span class="chip${hearts[i] ? " on" : i === hearts.length ? " now" : ""}"><b>Heart ${i + 1}</b>${esc(hearts[i] ? hearts[i].dish : i === hearts.length ? "Looking…" : "Empty")}</span>`).join("")}</div>
      <div class="deckmeta"><span>${hearts.length} of ${need} hearted</span><span>Card ${Math.min(pos + 1, cards.length)} of ${cards.length}</span></div>
      <article class="deckcard" aria-live="polite"><span class="k">${esc([c.cuisine, c.minutes && c.minutes + " min"].filter(Boolean).join(" ✶ "))}</span>
        <h3>${esc(c.dish)}</h3><span class="src">${esc(c.source || "")}</span>${c.why ? `<p>${esc(c.why)}</p>` : ""}
        <div class="pcv"><span>Protein</span><span>${esc(c.protein || "")}</span><span>Carb</span><span>${esc(c.carb || "")}</span><span>Veg</span><span>${esc(c.veg || "")}</span></div>
        ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Open the recipe →</a>` : ""}</article>
      ${undo}<div class="deckbtns"><button class="pill" data-act="deckpick" data-v="never" ${dis}>Never</button><button class="pill" data-act="deckpick" data-v="skip" ${dis}>Not this week</button></div>
      <button class="pill go" data-act="deckpick" data-v="heart" ${dis}>♥ Heart it</button>`;
  }
  return `<section class="deck" aria-label="Your Sunday picks">${head}${body}</section>`;
}

function savePicks(next, label) {
  const D = S.deck, w = D.week, me = myKey();
  D.history.push({ pk: { ...picksFor(w, me) }, label });
  S.picks = { ...S.picks, [w]: { ...(S.picks[w] || {}), [me]: next } }; render();
  write(() => S.db.doc(`decks/${w}/picks/${me}`).set({ ...next, ...stamp() }));
}
function deckAct(kind) {
  const D = S.deck, w = D.week, me = myKey();
  const cards = deckCards(w, me), need = deckNights(w, me).length, pk = picksFor(w, me), pos = pk.pos || 0;
  const c = cards[pos]; if (!c) return;
  const next = { pos: pos + 1, hearts: [...(pk.hearts || [])], never: [...(pk.never || [])], skipped: [...(pk.skipped || [])], auto: [] };
  ({ heart: next.hearts, never: next.never, skip: next.skipped })[kind].push(c.id);
  // Ran out of cards before hearting enough: fill from what's left that wasn't a never.
  if (next.hearts.length < need && next.pos >= cards.length) {
    const fill = cards.filter(x => !next.never.includes(x.id) && !next.hearts.includes(x.id)).slice(0, need - next.hearts.length).map(x => x.id);
    next.hearts.push(...fill); next.auto = fill;
  }
  D.order = null;
  savePicks(next, ({ heart: "heart on ", skip: "not this week on ", never: "never on " })[kind] + c.dish);
}
function deckConfirm() {
  const D = S.deck, w = D.week, me = myKey();
  const cards = deckCards(w, me), nights = deckNights(w, me), pk = picksFor(w, me);
  const order = (D.order || []).map(id => cards.find(c => c.id === id)).filter(Boolean);
  if (order.length < nights.length) return;
  const never = new Set(pk.never || []);
  const backups = deckBackups(order, cards.filter(c => !never.has(c.id) && !order.includes(c)));
  const patch = { nights: Object.fromEntries(nights.map((sl, i) => [sl, { kind: "cook", cook: me, options: [order[i], ...backups[i]] }])) };
  const slots = Object.fromEntries(nights.map((sl, i) => [sl, order[i].id]));
  write(async () => {
    await S.db.doc(`weeks/${w}`).update(patch);
    for (const id of never) { const c = cards.find(x => x.id === id); if (c) await S.db.collection("rejects").doc(recipeKey(c)).set({ dish: c.dish, source: c.source || "", link: c.link || "", week: w, slot: null, ...stamp() }); }
    D.history = [];
    await S.db.doc(`decks/${w}/picks/${me}`).set({ ...pk, done: true, slots, ...stamp() });
  }, "On the week.");
}

function resolveNames() {
  for (const e of document.querySelectorAll("[data-by]")) {
    const span = e.querySelector(".name"); if (!span) continue;
    const who = e.dataset.by;
    span.textContent = who && who === S.myName ? "you" : who || "someone";
  }
}

/* ---------- actions ---------- */
function nightRef(slot) { return S.db.collection("weeks").doc(S.weekId).collection("nights").doc(slot); }
async function saveNight(slot, patch) {
  const next = { ...(S.nights[slot] || {}), ...patch, ...stamp() };
  S.nights[slot] = next; render();
  await nightRef(slot).set(next);
}

const handlers = {
  focus: d => {
    S.focus = S.focus === d.slot ? null : d.slot; S.ui = {}; render();
    const el = document.getElementById("open");
    if (el) el.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  },
  ui: d => { S.ui[d.slot] = { mode: d.v }; render(); },
  close: () => { S.focus = null; S.ui = {}; render(); },
  week: d => { if (d.v) selectWeek(d.v); },
  pick: d => write(() => { S.ui = {}; return saveNight(d.slot, { current: d.id, boxPick: null }); }, "Swapped."),
  boxpick: d => { const b = S.box[d.key]; if (!b) return; write(() => { S.ui = {}; return saveNight(d.slot, { boxPick: b, flag: "cook" }); }, `${b.dish} it is.`); },
  reject: d => {
    const n = nightView(d.slot); const c = n.current; if (!c) return;
    write(async () => {
      S.ui = {};
      const patch = c.fromBox ? { boxPick: null } : { rejected: [...new Set([...(n.st.rejected || []), c.id])], current: null };
      await saveNight(d.slot, patch);
      await S.db.collection("rejects").doc(recipeKey(c)).set({ dish: c.dish, source: c.source || "", link: c.link || "", week: S.weekId, slot: d.slot, ...stamp() });
    }, `${c.dish} won't come back.`);
  },
  cook: d => { const n = nightView(d.slot); write(() => saveNight(d.slot, { cook: OTHER[n.cook] }), `${COOK[OTHER[n.cook]]} has ${DAY[d.slot]}.`); },
  flag: d => {
    const n = nightView(d.slot);
    // Back to cooking clears the flag when the plan already says cook; otherwise it overrides a planned night out.
    const v = d.v === "cook" ? (n.pk === "cook" ? null : "cook") : d.v;
    const msg = d.v === "order" ? "Ordering in. Its ingredients are off the list." : d.v === "out" ? "Eating out. Its ingredients are off the list." : "Back to cooking.";
    write(() => saveNight(d.slot, { flag: v }), msg);
  },
  heart: d => toggleBox(nightView(d.slot).current),
  heartrec: d => { if (S.tin.card === d.key && S.box[d.key]) S.tin = { ...S.tin, up: false, flipped: false }; toggleBox(S.box[d.key] || allPlanned().find(r => recipeKey(r) === d.key)); },
  unreject: d => { S.tin = { ...S.tin, up: false }; write(() => S.db.collection("rejects").doc(d.key).delete(), "Taped back in. Claude can suggest it again."); },
  request: d => {
    const note = (document.getElementById("req-" + d.slot) || {}).value || "";
    write(() => S.db.collection("requests").add({ week: S.weekId, slot: d.slot, note: note.trim().slice(0, 500), status: "open", ...stamp() }), "Asked. Claude will add options on its next run.");
  },
  check: d => {
    const items = { ...(S.checks.items || {}) }; const on = !isGot(d.key); items[d.key] = on; S.checks = { ...S.checks, items }; render();
    write(async () => {
      const ref = S.db.collection("checks").doc(S.weekId);
      try { await ref.update({ items: { [d.key]: on } }); }
      catch (e) { if (e && e.code === "invalid_argument" && !S.checksExist) await ref.set({ items }); else throw e; }
    });
  },
  staple: d => saveStaples([...S.staples, d.name]),
  tick: d => handlers.check(d),
  fridge: d => {
    S.fridgeOpen = d.v === "open"; store("session", "pax-fridge-open", S.fridgeOpen ? "1" : "0");
    if (S.fridgeOpen && !S.tipSeen) { S.tipSeen = true; store("local", "pax-fridge-tip", "1"); }
    render();
  },
  tintab: d => { const T = S.tin; S.tin = { ...T, tab: T.tab === d.v && !T.up ? null : d.v, up: false, flipped: false, picking: false }; render(); },
  tincard: d => { S.tin = { ...S.tin, card: d.key, up: true, flipped: false, picking: false }; render(); },
  tin: d => {
    const T = S.tin;
    if (d.v === "flip") S.tin = { ...T, flipped: !T.flipped, picking: false };
    else if (d.v === "putback") S.tin = { ...T, up: false, flipped: false, picking: false };
    else if (d.v === "pick") S.tin = { ...T, picking: true, flipped: false };
    else if (d.v === "unpick") S.tin = { ...T, picking: false };
    render();
  },
  tincook: d => {
    const b = S.box[S.tin.card]; if (!b || !S.weekId) return;
    S.tin = { ...S.tin, up: false, picking: false };
    write(() => saveNight(d.slot, { boxPick: b, flag: "cook" }), `${b.dish} is on for ${DAY[d.slot]}.`);
  },
  gonight: d => { S.tab = "tonight"; selectWeek(d.week); S.focus = d.slot; render(); scrollTo(0, 0); },
  deck: d => { S.deck = { week: d.v, history: [], started: false, order: null }; S.focus = null; render(); scrollTo(0, 0); },
  deckstart: () => { S.deck.started = true; render(); },
  deckclose: () => { S.deck = null; S.tab = "tonight"; render(); },
  deckpick: d => deckAct(d.v),
  deckundo: () => {
    const D = S.deck, last = D.history.pop(); if (!last) return;
    const w = D.week, me = myKey(); D.order = null;
    S.picks = { ...S.picks, [w]: { ...(S.picks[w] || {}), [me]: last.pk } }; render();
    write(() => S.db.doc(`decks/${w}/picks/${me}`).set({ ...last.pk, ...stamp() }));
  },
  deckswap: d => { const o = S.deck.order, i = Number(d.i); [o[i], o[i + 1]] = [o[i + 1], o[i]]; render(); },
  deckok: () => deckConfirm(),
  unstaple: d => saveStaples(S.staples.filter(s => norm(s) !== norm(d.name))),
};

function toggleBox(r) {
  if (!r) return;
  const k = recipeKey(r);
  if (S.box[k]) return write(() => S.db.collection("box").doc(k).delete(), "Removed from your recipe box.");
  const keep = ["dish", "source", "link", "cuisine", "minutes", "protein", "carb", "veg", "ingredients", "steps", "tweak"];
  const doc = { id: "box-" + k.slice(0, 40) }; keep.forEach(f => { if (r[f] !== undefined) doc[f] = r[f]; });
  write(() => S.db.collection("box").doc(k).set({ ...doc, ...stamp() }), "Saved to your recipe box.");
}

function saveStaples(list) {
  const seen = new Set(); const items = [];
  for (const s of list) { const t = s.trim(); if (t && !seen.has(norm(t))) { seen.add(norm(t)); items.push(t); } }
  S.staples = items; render();
  write(() => S.db.collection("staples").doc("list").set({ items, ...stamp() }));
}

document.addEventListener("click", e => {
  const tab = e.target.closest("nav.tabs button");
  if (tab) { S.tab = tab.dataset.tab; S.ui = {}; S.deck = null; render(); try { history.replaceState(null, "", "#" + (S.tab === "tonight" ? "week" : S.tab)); } catch (_) {} return; }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled || el.dataset.act === "check") return;
  const h = handlers[el.dataset.act]; if (h) h(el.dataset);
});
document.addEventListener("change", e => { const el = e.target.closest("[data-act=check]"); if (el) handlers.check(el.dataset); });
document.addEventListener("submit", e => {
  if (e.target.id !== "rename-form") return;
  e.preventDefault();
  const slot = e.target.dataset.slot, name = document.getElementById("rename-input").value.trim();
  const st = S.nights[slot] || {};
  if (!name || !st.boxPick) return;
  write(() => renameEverywhere(st.boxPick, name), "Named it.");
});
// A recipe can sit in the tin and on any number of nights as separate copies; renaming one renames them all.
async function renameEverywhere(card, name) {
  const same = c => c && (c.link ? c.link === card.link : c.id === card.id);
  const jobs = [];
  for (const { path, data } of S.db.all("box/")) if (same(data)) jobs.push(S.db.doc(path).update({ dish: name }));
  for (const { path, data } of S.db.all("weeks/")) if (/\/nights\/\w+$/.test(path) && same(data.boxPick)) jobs.push(S.db.doc(path).update({ boxPick: { dish: name }, ...stamp() }));
  await Promise.all(jobs);
}
document.addEventListener("submit", e => {
  if (e.target.id !== "tinname-form") return;
  e.preventDefault();
  const key = e.target.dataset.key, name = document.getElementById("tinname-input").value.trim();
  if (!name || !S.box[key]) return;
  write(() => renameEverywhere(S.box[key], name), "Named it.");
});
document.addEventListener("submit", e => {
  if (e.target.id !== "add-form") return;
  e.preventDefault();
  const link = document.getElementById("add-link").value.trim(), name = document.getElementById("add-name").value.trim();
  const where = document.getElementById("add-where").value;
  if (link && !safeLink(link)) return toast("That link needs to start with https://");
  if (!link && !name) return toast("Paste a link or give it a name.");
  const source = siteOf(link), key = recipeKey({ link, dish: name });
  const card = { dish: name || "Recipe from " + source, link, source, pending: true, savedBy: S.myName, id: "added-" + key.slice(0, 40), at: new Date().toISOString() };
  if (where === "tin") {
    write(async () => {
      await S.db.collection("box").doc(key).set({ ...card, cuisine: "New" });
      S.addOpen = false; S.tin = { tab: "c:New", card: key, up: true }; render();
    }, "In the tin, under New.");
    return;
  }
  const monday = mondayOf(where), slot = SLOTS[Math.round((new Date(where) - new Date(monday)) / 864e5)];
  write(async () => {
    await S.db.collection("weeks").doc(monday).collection("nights").doc(slot).update({ boxPick: card, flag: "cook", ...stamp() });
    S.addOpen = false; S.tab = "tonight"; selectWeek(monday); S.focus = slot; render();
  }, `On for ${DAY[slot]}.`);
});
document.addEventListener("toggle", e => { if (e.target.id === "staples-box") S.staplesOpen = e.target.open; if (e.target.id === "add-box") S.addOpen = e.target.open; if (e.target.id === "shared-box") S.sharedOpen = e.target.open; }, true);
document.addEventListener("submit", e => {
  if (e.target.id !== "staple-form") return;
  e.preventDefault(); const inp = document.getElementById("staple-input");
  if (inp.value.trim()) saveStaples([...S.staples, inp.value]);
});

/* ---------- data ---------- */
function selectWeek(id) {
  S.weekId = id; S.focus = null; S.ui = {}; S.nights = {}; S.checks = {}; S.checksExist = false;
  unsubWeek.forEach(u => u()); unsubWeek = [];
  if (S.db && id) {
    unsubWeek.push(S.db.collection("weeks").doc(id).collection("nights").onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S.nights = m; render();
    }, onErr));
    unsubWeek.push(S.db.collection("checks").doc(id).onSnapshot(d => { S.checksExist = d.exists; S.checks = d.exists ? d.data() : {}; render(); }, onErr));
  }
  render();
}
function onErr(e) { console.error(e); }

/* ---------- who's cooking ---------- */
// No accounts: each phone remembers whose it is. The name only labels changes ("Last changed by Nihal").
const sb = window.supabase && window.PAX_CONFIG && !/YOUR_/.test(window.PAX_CONFIG.url)
  ? window.supabase.createClient(window.PAX_CONFIG.url, window.PAX_CONFIG.anonKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } })
  : null;
const PEOPLE = ["Prithvi", "Nihal"];

function renderWho() {
  document.body.classList.add("out");
  document.getElementById("view").innerHTML = `<div class="signin"><h2>Who's cooking?</h2><p>Pick yourself. This phone will remember.</p>
    ${PEOPLE.map(n => `<button class="label" data-act="iam" data-v="${n}">I'm ${n}</button>`).join("")}</div>`;
}
handlers.iam = d => { store("local", "pax-me", d.v); start(); };
handlers.signout = () => { store("local", "pax-me", ""); location.reload(); };

async function start() {
  const tok = (location.hash || "").slice(1);
  if (tok === "list" || tok === "recipes") S.tab = tok;
  if (!sb) { document.getElementById("view").innerHTML = `<div class="signin"><h2>Almost ready</h2><p>Pax isn't connected to its database yet. Add the Supabase URL and key to config.js.</p></div>`; return; }
  const me = store("local", "pax-me");
  if (!PEOPLE.includes(me)) return renderWho();
  document.body.classList.remove("out");
  S.myName = me;
  document.getElementById("whoami").textContent = me + "'s phone.";
  const db = window.createPaxDb(sb);
  try { await db.start(); }
  catch (e) { console.error(e); S.offline = !navigator.onLine; toast("Couldn't load the plan. Pull down to retry."); }
  S.db = db;
  let first = true;
  db.collection("weeks").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (/^\d{4}-\d{2}-\d{2}$/.test(d.id)) m[d.id] = d.data(); }); S.weeks = m;
    if (first || !S.weekId) { first = false; S.loaded = true; selectWeek(chooseWeek()); } else render();
  });
  const coll = (name, key) => db.collection(name).onSnapshot(snap => { const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S[key] = m; render(); });
  coll("rejects", "rejects"); coll("box", "box"); coll("inbox", "inbox"); coll("hauls", "hauls");
  db.onPrefix("decks/", snap => {
    const decks = {}, picks = {};
    snap.docs.forEach(d => { const m = /^decks\/(\d{4}-\d{2}-\d{2})(?:\/picks\/(\w+))?$/.exec(d.id); if (!m) return; if (m[2]) (picks[m[1]] = picks[m[1]] || {})[m[2]] = d.data(); else decks[m[1]] = d.data(); });
    S.decks = decks; S.picks = picks; render();
  });
  db.collection("requests").where("status", "==", "open").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S.requests = m; render(); });
  db.collection("staples").doc("list").onSnapshot(d => { S.staples = d.exists ? (d.data().items || []) : []; render(); });
  // Catch up on anything missed while the phone was asleep or offline.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) db.refresh().catch(() => {}); });
  addEventListener("online", () => { S.offline = false; showBanner(); db.refresh().catch(() => {}); });
  addEventListener("offline", () => { S.offline = true; showBanner(); });
  showBanner();
}
start();

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
