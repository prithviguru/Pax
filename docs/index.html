<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pax</title>
<meta name="description" content="Prithvi and Nihal's weeknight dinners: who cooks, the recipe, nights in or out, the fridge and the recipe tin.">
<meta name="theme-color" content="#ff6347">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pax">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..600&display=swap">
<style>
/* Layout: a zine taped to the fridge. Red marquee, big wordmark, the week as paper notes, the open night as a white sheet with a receipt beside it. Light only, by design. */
:root {
  --linen: #eee2d4;
  --ink: #000000;
  --paper: #ffffff;
  --tape: #efefef;
  --tomato: #ff6347;
  --serif: "DM Sans", system-ui, sans-serif;
  --hand: "Reenie Beanie", "Bradley Hand", "Segoe Print", cursive;
  --print: "Times New Roman", Times, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--linen); overflow-x: clip; }
body { margin: 0; position: relative; background: var(--linen); color: var(--ink); font: 20px/1.3 var(--serif); overflow-x: hidden; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-weight: 400; margin: 0; text-wrap: balance; }
a { color: var(--ink); text-underline-offset: 5px; text-decoration-thickness: 1px; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--tomato); outline-offset: 3px; }
.print { font-family: var(--print); }
.hand { font-family: var(--hand); font-weight: 400; }

.marquee { background: var(--tomato); color: var(--ink); font-size: 20px; line-height: 1; padding-block: 9px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

header.top { position: relative; padding-block: 18px 0; min-height: 210px; }
.decor { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.decor img { position: absolute; display: block; height: auto; max-width: none; }
.v-tomato { top: 52px; right: -70px; width: 360px; transform: rotate(6deg); }
.v-peas { top: 120px; left: 46%; width: 230px; transform: rotate(18deg); }
.v-carrots { bottom: 150px; left: -70px; width: 320px; transform: rotate(-6deg); }
.marquee, header.top, main, footer.band { position: relative; z-index: 1; }
.wordmark { position: relative; z-index: 1; font-size: clamp(120px, 20vw, 230px); line-height: .82; letter-spacing: -0.035em; font-weight: 300; }
nav.tabs { position: relative; z-index: 1; display: flex; gap: 13px; flex-wrap: wrap; margin-top: 18px; }
nav.tabs button { background: var(--paper); border: 1px solid var(--ink); padding: 2px 12px; font-size: 26px; line-height: 1.2; }
nav.tabs button:nth-child(1) { transform: rotate(-2deg); }
nav.tabs button:nth-child(2) { transform: rotate(1.5deg); }
nav.tabs button:nth-child(3) { transform: rotate(-1deg); }
nav.tabs button[aria-current="page"] { background: var(--ink); color: var(--paper); }

main { padding-block: 48px 88px; display: grid; gap: 72px; max-width: 1400px; margin: 0 auto; }
.banner { background: var(--paper); border: 1px solid var(--ink); padding: 10px 12px; font-family: var(--print); font-size: 16px; max-width: 640px; }

.signin { display: grid; gap: 14px; max-width: 360px; }
.signin h2 { font-size: 40px; line-height: 1; }
.signin p { margin: 0; font-family: var(--print); font-size: 17px; }
.signin input { font: 20px var(--print); border: 1px solid var(--ink); background: var(--paper); padding: 10px 12px; border-radius: 0; width: 100%; color: var(--ink); }
.signin .label { font-size: 19px; text-align: center; }
body.out nav.tabs, body.out .whoami { visibility: hidden; }

/* Week */
.weekhead { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.weekhead h2 { font-size: 34px; }
.weekhead p { margin: 6px 0 0; font-family: var(--print); font-size: 16px; max-width: 620px; }
.ink { background: none; border: 0; padding: 0 2px; font-size: 18px; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; min-height: 40px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: 18px; row-gap: 40px; align-items: start; }
.day { display: grid; gap: 10px; min-width: 0; }
.note-wrap { position: relative; }
.tape { position: absolute; top: -10px; left: 50%; width: 58px; height: 18px; margin-left: -29px; background: var(--tape); border: 1px solid var(--ink); transform: rotate(-4deg); z-index: 1; pointer-events: none; }
.note { display: block; width: 100%; border: 1px solid var(--ink); background: var(--paper); padding: 14px 12px 12px; text-align: left; position: relative; }
.note.away { background: var(--tomato); }
.note[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 5px; }
.note .top { display: flex; justify-content: space-between; font-family: var(--print); font-size: 14px; text-transform: uppercase; }
.note .num { display: block; font-size: 60px; line-height: .95; letter-spacing: -0.03em; margin-top: 2px; font-weight: 300; }
.note .title { display: block; font-family: var(--hand); font-size: 34px; line-height: .95; margin-top: 8px; overflow-wrap: anywhere; }
.note .sub { display: block; font-family: var(--print); font-size: 15px; line-height: 1.25; margin-top: 8px; }
.note .stamp { position: absolute; right: -8px; top: 34px; transform: rotate(-10deg); border: 2px solid var(--ink); background: var(--tomato); padding: 0 8px; font-family: var(--hand); font-size: 30px; line-height: 1.1; }
.label { display: block; width: 100%; background: var(--paper); border: 1px solid var(--ink); padding: 6px 8px; font-size: 17px; line-height: 1.15; text-align: left; min-height: 40px; }
.label:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.daybtns { display: grid; gap: 6px; }

/* Open night */
.open { position: relative; padding-top: 34px; scroll-margin-top: 16px; }
.bigstamp { position: absolute; top: -34px; left: -4px; font-family: var(--hand); font-size: clamp(84px, 11vw, 140px); line-height: 1; color: var(--tomato); transform: rotate(-3deg); pointer-events: none; z-index: 0; }
.closer { position: absolute; top: 0; right: 0; z-index: 2; font-family: var(--print); font-size: 16px; }
.split { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 44px; align-items: start; }
.sheet { background: var(--paper); border: 1px solid var(--ink); padding: 22px; display: grid; gap: 16px; margin-top: 44px; min-width: 0; }
.sheet .kick { font-family: var(--print); font-size: 15px; text-transform: uppercase; }
.sheet h2 { font-size: clamp(38px, 5vw, 54px); line-height: 1; letter-spacing: -0.02em; }
.sheet h2 a { text-decoration-thickness: 1px; }
.sheet .src { font-family: var(--print); font-size: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 10px; }
.tags span { border: 1px solid var(--ink); padding: 1px 8px; font-size: 17px; }
.cookline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.cookline .who { font-family: var(--hand); font-size: 36px; line-height: 1; }
ol.steps { margin: 0; padding-left: 26px; display: grid; gap: 8px; font-size: 20px; }
.tweak { font-family: var(--print); font-size: 16px; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; border-top: 1px solid var(--ink); padding-top: 8px; }
.options { display: grid; gap: 8px; }
.option { text-align: left; background: var(--linen); border: 1px solid var(--ink); padding: 10px 12px; display: grid; gap: 2px; width: 100%; }
.option b { font-family: var(--hand); font-weight: 400; font-size: 30px; line-height: 1; }
.option span { font-family: var(--print); font-size: 15px; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 18px; }
textarea { font: 16px/1.3 var(--print); width: 100%; border: 1px solid var(--ink); background: var(--linen); padding: 8px 10px; border-radius: 0; color: var(--ink); }
.receipt { background: var(--paper); border: 1px solid var(--ink); padding: 16px 18px 20px; transform: rotate(1.5deg); font-family: var(--print); margin-top: 92px; min-width: 0; }
.receipt .rhead { font-size: 15px; text-transform: uppercase; text-align: center; border-bottom: 1px dashed var(--ink); padding-bottom: 8px; }
.receipt ul { margin: 0; padding: 8px 0 0; list-style: none; font-size: 18px; line-height: 1.7; }
.receipt li { border-bottom: 1px dotted var(--ink); }

/* List: the fridge (sage pantry) */
:root { --sage: #85906d; --sage-dk: #697056; --sage-ink: #4f553f; --cream: #f0e2cb; --cream-lt: #fbf4e6; --side: #e2d4b8; --coral: #e56a4f; --feet: #3a3b38; }
.fridge { position: relative; width: 100%; max-width: 350px; perspective: 1600px; padding-bottom: 16px; }
.fridge::before, .fridge::after { content: ""; position: absolute; bottom: 0; width: 34px; height: 18px; background: var(--feet); border-radius: 0 0 3px 3px; }
.fridge::before { left: 22px; } .fridge::after { right: 22px; }
.fridge.shut .inside { min-height: 0; max-height: 430px; }
.inside { position: relative; min-height: 640px; max-height: 2400px; transition: max-height .6s ease; background: var(--cream); border: 14px solid var(--sage); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; box-shadow: inset 12px 0 0 var(--side), inset -12px 0 0 var(--side); }
.compart { position: relative; padding: 10px 22px 12px; border-bottom: 8px solid var(--sage-dk); display: grid; gap: 6px; }
.compart.freezer { min-height: 104px; align-content: start; }
.compart.have { border-bottom: 0; align-content: start; }
.compart.drawer { margin: 0 10px 10px; padding: 18px 12px 12px; background: var(--cream-lt); border: 0; border-top: 6px solid var(--sage); box-shadow: 0 0 0 1px var(--side); }
.compart.drawer::before { content: ""; position: absolute; top: 6px; left: 50%; width: 64px; margin-left: -32px; height: 7px; background: var(--sage-dk); border-radius: 0 0 6px 6px; }
.compart > span { font-family: var(--print); font-size: 12px; text-transform: uppercase; color: var(--sage-ink); letter-spacing: .03em; }
.compart .none { font-family: var(--print); font-size: 14px; color: var(--sage-ink); }
.bottle { position: absolute; top: 12px; right: 24px; width: 18px; height: 46px; background: var(--coral); clip-path: polygon(35% 0, 65% 0, 65% 22%, 100% 40%, 100% 100%, 0 100%, 0 40%, 35% 22%); }
.shelfrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-items: end; }
.thing { display: flex; flex-direction: column; justify-content: flex-end; min-height: 48px; background: #fffaf1; border: 1px solid #b4aa8f; padding: 4px 6px; font: 14px/1.15 var(--print); text-align: left; color: var(--ink); overflow-wrap: anywhere; }
.thing.jar { border-radius: 4px 4px 8px 8px; border-top: 5px solid var(--sage); }
.thing.carton { clip-path: polygon(0 18%, 50% 0, 100% 18%, 100% 100%, 0 100%); padding-top: 12px; border-color: transparent; background: #fffaf1; }
.thing.bag { border-radius: 14px 14px 6px 6px; }
.thing.box { border-radius: 2px; background: #eef1ea; }
.thing.staple { border: 1px dashed var(--sage-ink); background: transparent; }
.thing.got { opacity: .4; }
.deckcta { display: grid; gap: 4px; width: 100%; text-align: left; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); padding: 14px 16px; font: inherit; }
.deckcta .k { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; opacity: .8; }
.deckcta b { font-size: 21px; font-weight: 500; line-height: 1.15; }
.deckcta span:last-child { font-size: 14px; opacity: .85; }
.deck { display: grid; gap: 14px; max-width: 520px; }
.deck h2 { margin: 0; font-size: 32px; font-weight: 500; line-height: 1.05; }
.deck p { margin: 0; font-size: 16px; }
.deck p.small { font-size: 14px; }
.pill { font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 999px; min-height: 48px; padding: 0 18px; }
.pill.go { background: var(--ink); color: var(--paper); }
.pill.small { min-height: 40px; font-size: 14px; justify-self: start; }
.pill.dashed { border-style: dashed; min-height: 40px; font-size: 14px; justify-self: start; background: transparent; }
.deckbtns { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.deckchips { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.deckchips .chip { border: 1px dashed var(--ink); padding: 8px 10px; font-size: 13px; line-height: 1.25; }
.deckchips .chip b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.deckchips .chip.now { border-style: solid; background: var(--paper); }
.deckchips .chip.on { border-style: solid; background: #f6f0e4; box-shadow: inset 6px 0 0 var(--sage); }
.deckmeta { display: flex; justify-content: space-between; font-size: 13px; }
.deckcard { position: relative; background: var(--paper); border: 1px solid var(--ink); padding: 26px 20px 18px; display: grid; gap: 10px; transform: rotate(-1deg); margin-top: 8px; }
.deckcard::before { content: ""; position: absolute; top: -10px; left: 50%; width: 64px; height: 18px; margin-left: -32px; background: rgba(239, 239, 239, .92); border: 1px solid rgba(0, 0, 0, .3); transform: rotate(-4deg); }
.deckcard .k { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
.deckcard h3 { margin: 0; font-size: 30px; font-weight: 500; line-height: 1.05; }
.deckcard .src { font-size: 14px; }
.deckcard p { font-size: 15px; }
.deckcard .pcv { display: grid; grid-template-columns: 64px minmax(0, 1fr); row-gap: 4px; font-size: 15px; border-top: 1px solid var(--ink); padding-top: 10px; }
.deckcard .pcv span:nth-child(odd) { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.deckcard a { font-size: 15px; justify-self: start; }
.deckrows { display: grid; gap: 8px; }
.deckrow { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 12px; align-items: center; border: 1px solid var(--ink); background: var(--paper); padding: 10px 12px; }
.deckrow .d { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; text-align: center; line-height: 1; }
.deckrow .d b { display: block; font-size: 22px; font-weight: 500; margin-top: 2px; }
.deckrow b { display: block; font-size: 17px; font-weight: 500; }
.deckrow small { display: block; font-size: 13px; }
.thing.stocked { background: #e9ecdf; border-color: var(--sage); }
.compart .stockedlabel { margin-top: 4px; }
.thing.got span { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--coral); }
.door { position: absolute; inset: 0 0 16px 0; transform-origin: 0 50%; transition: transform .7s cubic-bezier(.3,.7,.2,1); z-index: 3; }
.door.open { transform: rotateY(-112deg); pointer-events: none; }
.door-face { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 5px; background: var(--sage-dk); border-radius: 18px 18px 16px 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.door-face .panel { position: relative; background: var(--sage); border-radius: 18px 18px 6px 6px; }
.door-face .panel.fz { height: 128px; }
.door-face .panel.main { flex: 1; border-radius: 6px 6px 16px 16px; }
.handle { position: absolute; right: 22px; width: 13px; background: var(--cream); border: 0; border-radius: 3px; padding: 0; box-shadow: -2px 0 0 rgba(0,0,0,.12); }
.doornote { position: absolute; left: 7%; top: 30px; width: min(196px, 60%); background: var(--coral); padding: 22px 14px 14px; transform: rotate(-3deg); font-family: var(--print); font-size: 15px; color: var(--ink); }
.doornote b { display: block; font-family: var(--hand); font-weight: 400; font-size: 38px; line-height: .95; margin-bottom: 8px; }
.magnet { position: absolute; top: -10px; left: 50%; margin-left: -12px; width: 24px; height: 22px; background: var(--feet); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.tip { position: absolute; right: 4px; top: 266px; z-index: 4; background: var(--paper); border: 1px solid var(--ink); padding: 2px 8px; font: 24px/1 var(--hand); pointer-events: none; transform: rotate(-2deg); }
.tip::before { content: ""; position: absolute; top: -7px; right: 20px; width: 10px; height: 10px; background: var(--paper); border-left: 1px solid var(--ink); border-top: 1px solid var(--ink); transform: rotate(45deg); }
.fridgebar { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 350px; font-family: var(--print); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--paper); border: 1px solid var(--ink); padding: 2px 10px; font-family: var(--print); font-size: 15px; }
.addrow { display: flex; gap: 8px; margin-top: 10px; max-width: 350px; }
.addrow input { flex: 1; min-width: 0; font: 16px var(--print); border: 1px solid var(--ink); background: var(--paper); padding: 6px 10px; border-radius: 0; }
.addrow button { background: var(--paper); border: 1px solid var(--ink); padding: 4px 14px; font-size: 18px; }
.field { font: 16px var(--print); border: 1px solid var(--ink); background: var(--paper); color: var(--ink); padding: 6px 10px; border-radius: 0; min-width: 0; }

/* Recipes: the tin */
.shelf { display: grid; gap: 4px; }
.shelf h2 { font-size: 34px; margin-bottom: 6px; }
.stage { position: relative; width: 100%; max-width: 400px; height: 660px; overflow: hidden; }
.slot { position: absolute; left: 14px; right: 14px; top: 50px; height: 418px; perspective: 1300px; z-index: 1; transition: transform .55s cubic-bezier(.3,.7,.2,1); }
.slot.down { transform: translateY(480px); visibility: hidden; transition: transform .55s cubic-bezier(.3,.7,.2,1), visibility 0s .55s; }
.card3d { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,.7,.2,1); }
.card3d.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid #c9bfa8; background-color: #fbf6ee; background-image: repeating-linear-gradient(to bottom, transparent 0 31px, #e6dccb 31px 32px); background-position: 0 58px; box-shadow: inset 0 52px 0 -50px var(--coral); padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.face.back { transform: rotateY(180deg); overflow-y: auto; }
.face.torn { background: var(--coral); background-image: none; box-shadow: none; border-color: var(--coral); }
.face .kick { font-family: var(--print); font-size: 13px; text-transform: uppercase; color: var(--sage-ink); }
.face.torn .kick { color: var(--ink); }
.face .dish { font-family: var(--hand); font-size: 52px; line-height: .9; margin-top: 16px; overflow-wrap: anywhere; }
.face .meta { font-family: var(--print); font-size: 15px; }
.face .pcv { font-size: 17px; line-height: 2; }
.face .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--sage-dk); padding-top: 2px; }
.face ol { margin: 4px 0 0; padding-left: 22px; display: grid; gap: 6px; font-size: 16px; line-height: 1.3; }
.nights { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.nights button { background: #fffaf1; border: 1px solid var(--sage-dk); padding: 6px 2px; font: 14px/1.1 var(--print); min-height: 44px; }
.strip { position: absolute; left: 26px; right: 26px; height: 64px; border: 1px solid #c9bfa8; background: #fbf6ee; text-align: left; padding: 6px 12px; font: 400 30px/1 var(--hand); z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; overflow: hidden; color: var(--ink); }
.strip small { font: 12px/1.4 var(--print); text-transform: uppercase; white-space: nowrap; padding-top: 4px; color: var(--sage-ink); }
.strip.torn { background: var(--coral); border-color: var(--coral); clip-path: polygon(0 0, 100% 0, 100% 100%, 92% 92%, 84% 100%, 76% 93%, 68% 100%, 60% 92%, 52% 100%, 44% 93%, 36% 100%, 28% 92%, 20% 100%, 12% 93%, 4% 100%, 0 94%); }
.strip.torn small { color: var(--ink); }
.lid { position: absolute; left: 6px; right: 6px; top: 470px; height: 96px; background: var(--coral); clip-path: polygon(0 0, 100% 0, 98% 100%, 2% 100%); z-index: 0; }
.dividers { position: absolute; left: 14px; right: 14px; top: 512px; display: grid; gap: 4px; z-index: 2; align-items: end; }
.divider { position: relative; height: 58px; border: 1px solid #c9bfa8; border-bottom: 0; background: #fbf6ee; padding: 0; transition: transform .2s; }
.divider .tab { position: absolute; top: -1px; left: 4px; right: 4px; height: 30px; background: var(--sage); color: var(--ink); border-radius: 4px 4px 0 0; transform: translateY(-62%); font: 11px/1 var(--print); text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; overflow: hidden; }
.divider .tab b { font-weight: 700; }
.divider.never .tab { background: var(--coral); color: var(--ink); }
.divider[aria-pressed="true"] { transform: translateY(-10px); }
.tin { position: absolute; left: 0; right: 0; top: 556px; bottom: 6px; background: var(--sage); z-index: 3; display: flex; align-items: center; justify-content: center; border-radius: 3px; box-shadow: inset 0 6px 0 rgba(0,0,0,.08); }

<div class="decor" aria-hidden="true">
