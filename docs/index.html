}

// What the "Add to Pax" Shortcut delivered, and where the database filed each one.
function renderShared() {
  const items = Object.entries(S.inbox).map(([id, d]) => ({ id, ...d }));
  if (!items.length) return "";
  const where = d => {
    const m = /^weeks\/(\d{4}-\d{2}-\d{2})\/nights\/(\w+)$/.exec(d.filedTo || "");
    if (m) return { text: `${DAY[m[2]] || m[2]} ${shortDate(addDays(m[1], SLOTS.indexOf(m[2])))}`, week: m[1], slot: m[2] };
    if (/^box\//.test(d.filedTo || "")) return { text: "the recipe tin" };
    return { text: d.status ? `nowhere (${d.status})` : "nowhere yet" };
  };
  const row = d => { const w = where(d); return `<div class="rec"><div class="t"><b>${esc(d.title || (siteOf(d.url) === "the web" ? (d.url || "").replace(/^https?:\/\//, "").slice(0, 40) : siteOf(d.url) || "No link"))}</b><small>${esc(d.by || "Someone")} picked ${esc(d.night || "?")} · went to ${esc(w.text)}</small></div>${w.week ? `<button class="ghost" data-act="gonight" data-week="${w.week}" data-slot="${w.slot}">Open</button>` : ""}</div>`; };
  return `<details id="shared-box" style="margin-bottom:16px" ${S.sharedOpen ? "open" : ""}><summary>Shared from your phones · ${items.length}</summary><div class="list">${items.map(row).join("")}</div></details>`;
}

// The Sunday deck: heart as many dishes as you have cook nights, then put them on your nights.
function renderDeck() {
  const D = S.deck, w = D.week, me = myKey(), dis = S.canWrite ? "" : "disabled";
  const cards = deckCards(w, me), nights = deckNights(w, me), need = nights.length;
  const pk = picksFor(w, me), pos = pk.pos || 0;
  const byId = id => cards.find(c => c.id === id);
  const hearts = (pk.hearts || []).map(byId).filter(Boolean);
  const days = nights.map(sl => DAY[sl]).join(" and ");
  const other = Object.keys((deckFor(w) || {}).people || {}).find(p => p !== me);
  const undo = D.history.length ? `<button data-act="deckundo">Undo ${esc(D.history[D.history.length - 1].label.split(" on ")[0])}</button>` : "<span></span>";
  const row = (sl, c, note) => `<div class="deckrow"><span class="d k">${esc(DAY[sl].slice(0, 3))}<b>${dayNum(addDays(w, SLOTS.indexOf(sl)))}</b></span><span><strong>${esc(c ? c.dish : "Nothing yet")}</strong><small>${esc(note || "")}</small></span></div>`;
  const title = need === 1 ? `${DAY[nights[0]]}'s dinner` : `${need} dinners`;
  const top = (count) => `<img class="art" src="${ART.tomato}" alt="" aria-hidden="true"><div class="line"><span class="k">Week of ${esc(dayUp(w))}${count ? " · " + count : ""}</span><button class="sq" data-act="deckclose" aria-label="Close">${ICON.x}</button></div>`;
  let body;
  if (!need || !cards.length) {
    body = top("") + `<h1>Nothing to pick</h1><p class="lede">There's no deck for you this week.</p><div class="actions2"><button class="primary" data-act="deckclose">Back to the week ${ICON.arrow}</button></div>`;
  } else if (pk.done) {
    const slots = pk.slots || {};
    body = top("Done") + `<h1>You're set.</h1><p class="lede">Your nights are on the week and the list.${other && !picksFor(w, other).done ? ` ${esc(COOK[other])} hasn't picked yet. Anything still open at the deadline gets Claude's top picks.` : ""}</p>
      <div class="deckrows">${nights.map(sl => { const c = byId(slots[sl]); return row(sl, c, c ? [c.cuisine, c.minutes && c.minutes + " min", (pk.auto || []).includes(c.id) ? "Claude's pick" : "You picked it"].filter(Boolean).join(" · ") : ""); }).join("")}</div>
      <div class="actions2">${openDeckWeek(w) ? `<button class="primary" data-act="deck" data-v="${openDeckWeek(w)}">Next: week of ${esc(shortDate(openDeckWeek(w)))} ${ICON.arrow}</button><button class="ghost" data-act="deckclose">Back to the week</button>` : `<button class="primary" data-act="deckclose">Back to the week ${ICON.arrow}</button>`}<button class="ghost" data-act="deckredo" ${dis}>Change my picks</button><p class="say small">Changing starts your deck over. Your nights keep their picks until you put new ones on the week.</p></div>`;
  } else if (hearts.length >= need) {
    const order = (D.order || bestOrder(hearts, nights, (deckFor(w) || {}).lean).map(c => c.id)).map(byId);
    D.order = order.map(c => c.id);
    const lean = (deckFor(w) || {}).lean || {};
    const hint = need < 2 ? "" : order.every(isAsian) ? "Both are Asian, so one lands next to another Asian night. Fine if you're craving it." : Object.keys(lean).length ? "The Asian one goes on the week's Asian night, so there are no two stir-fries in a row. Swap if you'd rather." : "";
    body = top("Almost") + `<h1>${need > 1 ? "Which night for which?" : "Put it on the week"}</h1>${hint ? `<p class="lede">${esc(hint)}</p>` : ""}
      <div class="deckrows">${nights.map((sl, i) => row(sl, order[i], order[i] ? [order[i].cuisine, order[i].minutes && order[i].minutes + " min", (pk.auto || []).includes(order[i].id) ? "Claude's pick: the deck ran out" : ""].filter(Boolean).join(" · ") : "") + (i < nights.length - 1 ? `<button class="ghost" data-act="deckswap" data-i="${i}" aria-label="Swap ${DAY[sl]} and ${DAY[nights[i + 1]]}">Swap ${esc(DAY[sl].slice(0, 3))} and ${esc(DAY[nights[i + 1]].slice(0, 3))}</button>` : "")).join("")}</div>
      <div class="actions2"><button class="primary red" data-act="deckok" ${dis}>Put ${need > 1 ? "them" : "it"} on the week ${ICON.arrow}</button><div class="deckfoot">${undo}</div></div>`;
  } else if (!D.started && !pos) {
    body = top("") + `<h1>${cards.length} dishes. Heart ${need}.</h1>
      <p class="lede">You cook ${esc(days)}. Heart the ones you'd actually be excited to eat, then put them on your nights.</p>
      <p class="say small" style="margin-top:12px">Swipe right to heart, left for not this week. Never takes it off the list for good.${other ? ` ${esc(COOK[other])} picks their own nights on their phone.` : ""}</p>
      <div class="actions2"><button class="primary" data-act="deckstart">Start ${ICON.arrow}</button><button class="ghost" data-act="deckclose">Later</button></div>`;
  } else {
    const c = cards[Math.min(pos, cards.length - 1)];
    const link = safeLink(c.link), img = photo(c);
    const count = `${String(Math.min(pos + 1, cards.length)).padStart(2, "0")} / ${String(cards.length).padStart(2, "0")}`;
    body = top(count) + `<h1>${esc(title)}</h1><div class="hearts">${nights.map((_, i) => `<span class="${hearts[i] ? "on" : i === hearts.length ? "now" : ""}"><b class="k">Heart ${i + 1}</b>${esc(hearts[i] ? hearts[i].dish : i === hearts.length ? "Looking…" : "–")}</span>`).join("")}</div>
      <div class="stage"><span class="tape" aria-hidden="true"></span><article class="deckcard" aria-live="polite">
        <div class="ph">${img || `<img class="art" src="${ART[artFor(c)]}" alt="" aria-hidden="true">`}</div>
        <div class="body"><div class="top k"><span style="color:var(--red-ink)">${esc([c.cuisine, c.minutes && c.minutes + " min"].filter(Boolean).join(" · "))}</span><span>${esc(c.source || "")}</span></div>
        <h2>${esc(c.dish)}</h2>${c.why ? `<p>${esc(c.why)}</p>` : ""}
        <div class="chips">${[c.protein, c.carb, c.veg].filter(Boolean).map(x => `<span class="chip plain">${esc(x)}</span>`).join("")}</div>
        ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Open the recipe ↗</a>` : ""}</div></article></div>
      <div class="choose"><button data-act="deckpick" data-v="skip" ${dis}>${ICON.x} Not this week</button><button class="go" data-act="deckpick" data-v="heart" ${dis}><span style="color:var(--red)">${ICON.heart}</span> Heart it</button></div>
      <div class="deckfoot">${undo}<span>or swipe the card</span><button data-act="deckpick" data-v="never" ${dis}>Never suggest this</button></div>`;
  }
  return `<section class="deck" aria-label="Your Sunday picks">${body}</section>`;
}

// Swipe the deck card like Hinge: right hearts it, left is "not this week". Never stays a button, since it's permanent.
let drag = null;
document.addEventListener("pointerdown", e => {
  const card = e.target.closest(".deckcard");
  if (!card || e.target.closest("a, button") || !S.canWrite) return;
  drag = { card, x: e.clientX, dx: 0, id: e.pointerId };
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.dx = e.clientX - drag.x;
  if (Math.abs(drag.dx) < 6) return;
  const { card, dx } = drag;
  card.style.transition = "none";
  card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
  card.dataset.dir = dx > 0 ? "heart" : "skip";
  card.style.setProperty("--o", Math.min(1, Math.abs(dx) / 110).toFixed(2));
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const { card, dx } = drag; drag = null;
  if (Math.abs(dx) > 110) {
    card.style.transition = "transform .22s ease-out";
    card.style.transform = `translateX(${dx > 0 ? 640 : -640}px) rotate(${dx > 0 ? 24 : -24}deg)`;
    setTimeout(() => deckAct(dx > 0 ? "heart" : "skip"), 180);
  } else {
    card.style.transition = "transform .2s ease-out"; card.style.transform = ""; delete card.dataset.dir;
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

function savePicks(next, label) {
  const D = S.deck, w = D.week, me = myKey();
  D.history.push({ pk: { ...picksFor(w, me) }, label });
  S.picks = { ...S.picks, [w]: { ...(S.picks[w] || {}), [me]: next } }; render();
  write(() => S.db.doc(`decks/${w}/picks/${me}`).set({ ...next, ...stamp() }));
}
function deckAct(kind) {
  const D = S.deck, w = D.week, me = myKey();
  const cards = deckCards(w, me), need = deckNights(w, me).length, pk = picksFor(w, me), pos = pk.pos || 0;
  const c = cards[pos]; if (!c) return;
  const next = { pos: pos + 1, hearts: [...(pk.hearts || [])], never: [...(pk.never || [])], skipped: [...(pk.skipped || [])], auto: [] };
  ({ heart: next.hearts, never: next.never, skip: next.skipped })[kind].push(c.id);
  // Ran out of cards before hearting enough: fill from what's left that wasn't a never.
  if (next.hearts.length < need && next.pos >= cards.length) {
    const fill = cards.filter(x => !next.never.includes(x.id) && !next.hearts.includes(x.id)).slice(0, need - next.hearts.length).map(x => x.id);
    next.hearts.push(...fill); next.auto = fill;
  }
  D.order = null;
  savePicks(next, ({ heart: "heart on ", skip: "not this week on ", never: "never on " })[kind] + c.dish);
}
function deckConfirm() {
  const D = S.deck, w = D.week, me = myKey();
  const cards = deckCards(w, me), nights = deckNights(w, me), pk = picksFor(w, me);
  const order = (D.order || []).map(id => cards.find(c => c.id === id)).filter(Boolean);
  if (order.length < nights.length) return;
  const never = new Set(pk.never || []);
  const backups = deckBackups(order, cards.filter(c => !never.has(c.id) && !order.includes(c)));
  const patch = { nights: Object.fromEntries(nights.map((sl, i) => [sl, { kind: "cook", cook: me, options: [order[i], ...backups[i]] }])) };
  const slots = Object.fromEntries(nights.map((sl, i) => [sl, order[i].id]));
  write(async () => {
    await S.db.doc(`weeks/${w}`).update(patch);
    for (const id of never) { const c = cards.find(x => x.id === id); if (c) await S.db.collection("rejects").doc(recipeKey(c)).set({ dish: c.dish, source: c.source || "", link: c.link || "", week: w, slot: null, ...stamp() }); }
    D.history = [];
    await S.db.doc(`decks/${w}/picks/${me}`).set({ ...pk, done: true, slots, ...stamp() });
  }, "On the week.");
}

function resolveNames() {
  for (const e of document.querySelectorAll("[data-by]")) {
    const span = e.querySelector(".name"); if (!span) continue;
    const who = e.dataset.by;
    span.textContent = who && who === S.myName ? "you" : who || "someone";
  }
}

/* ---------- actions ---------- */
function nightRef(slot) { return S.db.collection("weeks").doc(S.weekId).collection("nights").doc(slot); }
async function saveNight(slot, patch) {
  const next = { ...(S.nights[slot] || {}), ...patch, ...stamp() };
  S.nights[slot] = next; render();
  await nightRef(slot).set(next);
}

const handlers = {
  focus: d => {
    S.focus = d.slot; S.ui = {}; render(); scrollTo(0, 0);
  },
  ui: d => { S.ui[d.slot] = { mode: d.v }; render(); },
  close: () => { S.focus = null; S.ui = {}; render(); scrollTo(0, 0); },
  week: d => { if (d.v) selectWeek(d.v); },
  pick: d => write(() => { S.ui = {}; return saveNight(d.slot, { current: d.id, boxPick: null }); }, "Swapped."),
  boxpick: d => { const b = S.box[d.key]; if (!b) return; write(() => { S.ui = {}; return saveNight(d.slot, { boxPick: b, flag: "cook" }); }, `${b.dish} it is.`); },
  reject: d => {
    const n = nightView(d.slot); const c = n.current; if (!c) return;
    write(async () => {
      S.ui = {};
      const patch = c.fromBox ? { boxPick: null } : { rejected: [...new Set([...(n.st.rejected || []), c.id])], current: null };
      await saveNight(d.slot, patch);
      await S.db.collection("rejects").doc(recipeKey(c)).set({ dish: c.dish, source: c.source || "", link: c.link || "", week: S.weekId, slot: d.slot, ...stamp() });
    }, `${c.dish} won't come back.`);
  },
  cook: d => { const n = nightView(d.slot); write(() => saveNight(d.slot, { cook: OTHER[n.cook] }), `${COOK[OTHER[n.cook]]} has ${DAY[d.slot]}.`); },
  flag: d => {
    const n = nightView(d.slot);
    // Back to cooking clears the flag when the plan already says cook; otherwise it overrides a planned night out.
    const v = d.v === "cook" ? (n.pk === "cook" ? null : "cook") : d.v;
    const msg = d.v === "order" ? "Ordering in. Its ingredients are off the list." : d.v === "out" ? "Eating out. Its ingredients are off the list." : "Back to cooking.";
    write(() => saveNight(d.slot, { flag: v }), msg);
  },
  heart: d => toggleBox(nightView(d.slot).current),
  heartrec: d => { if (S.tin.card === d.key && S.box[d.key]) S.tin = { ...S.tin, card: null, picking: false }; toggleBox(S.box[d.key] || allPlanned().find(r => recipeKey(r) === d.key)); },
  unreject: d => { S.tin = { ...S.tin, card: null }; write(() => S.db.collection("rejects").doc(d.key).delete(), "Taped back in. Claude can suggest it again."); },
  request: d => {
    const note = (document.getElementById("req-" + d.slot) || {}).value || "";
    write(() => S.db.collection("requests").add({ week: S.weekId, slot: d.slot, note: note.trim().slice(0, 500), status: "open", ...stamp() }), "Asked. Claude will add options on its next run.");
  },
  check: d => {
    const items = { ...(S.checks.items || {}) }; const on = !isGot(d.key); items[d.key] = on; S.checks = { ...S.checks, items }; render();
    write(async () => {
      const ref = S.db.collection("checks").doc(S.weekId);
      try { await ref.update({ items: { [d.key]: on } }); }
      catch (e) { if (e && e.code === "invalid_argument" && !S.checksExist) await ref.set({ items }); else throw e; }
    });
  },
  staple: d => saveStaples([...S.staples, d.name]),
  tick: d => handlers.check(d),
  tintab: d => { S.tin = { tab: d.v, card: null, picking: false }; render(); },
  tincard: d => { S.tin = { ...S.tin, card: d.key, picking: false }; render(); scrollTo(0, 0); },
  tin: d => {
    const T = S.tin;
    if (d.v === "add") { S.addOpen = !S.addOpen || !!T.card; S.tin = { ...T, card: null, picking: false }; render(); return; }
    else if (d.v === "back") S.tin = { ...T, card: null, picking: false };
    else if (d.v === "pick") S.tin = { ...T, picking: true };
    else if (d.v === "unpick") S.tin = { ...T, picking: false };
    render();
  },
  tincook: d => {
    const b = S.box[S.tin.card]; if (!b || !S.weekId) return;
    S.tin = { ...S.tin, card: null, picking: false };
    write(() => saveNight(d.slot, { boxPick: b, flag: "cook" }), `${b.dish} is on for ${DAY[d.slot]}.`);
  },
  gonight: d => { S.tab = "tonight"; selectWeek(d.week); S.focus = d.slot; render(); scrollTo(0, 0); },
  deck: d => { S.deck = { week: d.v, history: [], started: false, order: null }; S.focus = null; render(); scrollTo(0, 0); },
  deckstart: () => { S.deck.started = true; render(); },
  deckclose: () => { const w = S.deck && S.deck.week; S.deck = null; S.tab = "tonight"; if (w && S.weeks[w] && w !== S.weekId) selectWeek(w); else render(); scrollTo(0, 0); },
  deckpick: d => deckAct(d.v),
  deckundo: () => {
    const D = S.deck, last = D.history.pop(); if (!last) return;
    const w = D.week, me = myKey(); D.order = null;
    S.picks = { ...S.picks, [w]: { ...(S.picks[w] || {}), [me]: last.pk } }; render();
    write(() => S.db.doc(`decks/${w}/picks/${me}`).set({ ...last.pk, ...stamp() }));
  },
  deckswap: d => { const o = S.deck.order, i = Number(d.i); [o[i], o[i + 1]] = [o[i + 1], o[i]]; render(); },
  deckok: () => deckConfirm(),
  deckredo: () => {
    const D = S.deck, w = D.week, me = myKey();
    const fresh = { pos: 0, hearts: [], never: [], skipped: [], auto: [] };
    D.history = []; D.order = null; D.started = true;
    S.picks = { ...S.picks, [w]: { ...(S.picks[w] || {}), [me]: fresh } }; render();
    write(() => S.db.doc(`decks/${w}/picks/${me}`).set({ ...fresh, ...stamp() }));
  },
  ownclear: d => write(() => { S.ui = {}; return saveNight(d.slot, { boxPick: null }); }, "Back to the plan."),
  unstaple: d => saveStaples(S.staples.filter(s => norm(s) !== norm(d.name))),
};

function toggleBox(r) {
  if (!r) return;
  const k = recipeKey(r);
  if (S.box[k]) return write(() => S.db.collection("box").doc(k).delete(), "Removed from your recipe box.");
  const keep = ["dish", "source", "link", "image", "cuisine", "minutes", "protein", "carb", "veg", "ingredients", "steps", "tweak"];
  const doc = { id: "box-" + k.slice(0, 40) }; keep.forEach(f => { if (r[f] !== undefined) doc[f] = r[f]; });
  write(() => S.db.collection("box").doc(k).set({ ...doc, ...stamp() }), "Saved to your recipe box.");
}

function saveStaples(list) {
  const seen = new Set(); const items = [];
  for (const s of list) { const t = s.trim(); if (t && !seen.has(norm(t))) { seen.add(norm(t)); items.push(t); } }
  S.staples = items; render();
  write(() => S.db.collection("staples").doc("list").set({ items, ...stamp() }));
}

document.addEventListener("click", e => {
  const tab = e.target.closest(".tabbar button");
  if (tab) { S.tab = tab.dataset.tab; S.ui = {}; S.deck = null; S.focus = null; S.tin = { ...S.tin, card: null, picking: false }; render(); scrollTo(0, 0); try { history.replaceState(null, "", "#" + (S.tab === "tonight" ? "week" : S.tab)); } catch (_) {} return; }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled || el.dataset.act === "check") return;
  const h = handlers[el.dataset.act]; if (h) h(el.dataset);
});
document.addEventListener("change", e => { const el = e.target.closest("[data-act=check]"); if (el) handlers.check(el.dataset); });
document.addEventListener("submit", e => {
  if (e.target.id !== "rename-form") return;
  e.preventDefault();
  const slot = e.target.dataset.slot, name = document.getElementById("rename-input").value.trim();
  const st = S.nights[slot] || {};
  if (!name || !st.boxPick) return;
  write(() => renameEverywhere(st.boxPick, name), "Named it.");
});
// A recipe can sit in the tin and on any number of nights as separate copies; renaming one renames them all.
async function renameEverywhere(card, name) {
  const same = c => c && (c.link ? c.link === card.link : c.id === card.id);
  const jobs = [];
  for (const { path, data } of S.db.all("box/")) if (same(data)) jobs.push(S.db.doc(path).update({ dish: name }));
  for (const { path, data } of S.db.all("weeks/")) if (/\/nights\/\w+$/.test(path) && same(data.boxPick)) jobs.push(S.db.doc(path).update({ boxPick: { dish: name }, ...stamp() }));
  await Promise.all(jobs);
}
document.addEventListener("submit", e => {
  if (e.target.id !== "tinname-form") return;
  e.preventDefault();
  const key = e.target.dataset.key, name = document.getElementById("tinname-input").value.trim();
  if (!name || !S.box[key]) return;
  write(() => renameEverywhere(S.box[key], name), "Named it.");
});
document.addEventListener("submit", e => {
  if (e.target.id !== "add-form") return;
  e.preventDefault();
  const link = document.getElementById("add-link").value.trim(), name = document.getElementById("add-name").value.trim();
  const where = document.getElementById("add-where").value;
  if (link && !safeLink(link)) return toast("That link needs to start with https://");
  if (!link && !name) return toast("Paste a link or give it a name.");
  const source = siteOf(link), key = recipeKey({ link, dish: name });
  const card = { dish: name || "Recipe from " + source, link, source, pending: true, savedBy: S.myName, id: "added-" + key.slice(0, 40), at: new Date().toISOString() };
  if (where === "tin") {
    write(async () => {
      await S.db.collection("box").doc(key).set({ ...card, cuisine: "New" });
      S.addOpen = false; S.tin = { tab: "all", card: key, picking: false }; render(); scrollTo(0, 0);
    }, "In the tin, under New.");
    return;
  }
  const monday = mondayOf(where), slot = SLOTS[Math.round((new Date(where) - new Date(monday)) / 864e5)];
  write(async () => {
    await S.db.collection("weeks").doc(monday).collection("nights").doc(slot).update({ boxPick: card, flag: "cook", ...stamp() });
    S.addOpen = false; S.tab = "tonight"; selectWeek(monday); S.focus = slot; render();
  }, `On for ${DAY[slot]}.`);
});
document.addEventListener("submit", e => {
  if (e.target.id !== "own-form") return;
  e.preventDefault();
  const slot = e.target.dataset.slot, val = id => document.getElementById(id).value.trim();
  const dish = val("own-dish"), link = val("own-link");
  if (!dish) { write(() => { S.ui = {}; return saveNight(slot, { boxPick: { id: "blank", blank: true, own: true, dish: "" } }); }, `${DAY[slot]} is blank.`); return; }
  if (link && !safeLink(link)) return toast("That link needs to start with https://");
  const cur = nightView(slot).current, ing = val("own-ing").split(/[\n,]+/).map(x => x.trim()).filter(Boolean);
  if (cur && cur.dish === dish && (cur.link || "") === link && (cur.tweak || "") === val("own-note") && (cur.ingredients || []).join("|") === ing.join("|")) { S.ui = {}; render(); return; }
  const prev = (S.nights[slot] || {}).boxPick;
  const card = { id: prev && prev.own && !prev.blank ? prev.id : "own-" + Date.now().toString(36), dish, own: true, link, source: siteOf(link),
    ingredients: ing, tweak: val("own-note"), by: S.myName };
  write(() => { S.ui = {}; return saveNight(slot, { boxPick: card, flag: "cook" }); }, `${dish} is on for ${DAY[slot]}.`);
});
document.addEventListener("toggle", e => { if (e.target.id === "staples-box") S.staplesOpen = e.target.open; if (e.target.id === "add-box") S.addOpen = e.target.open; if (e.target.id === "shared-box") S.sharedOpen = e.target.open; }, true);
document.addEventListener("submit", e => {
  if (e.target.id !== "staple-form") return;
  e.preventDefault(); const inp = document.getElementById("staple-input");
  if (inp.value.trim()) saveStaples([...S.staples, inp.value]);
});

/* ---------- data ---------- */
function selectWeek(id) {
  S.weekId = id; S.focus = null; S.ui = {}; S.nights = {}; S.checks = {}; S.checksExist = false;
  unsubWeek.forEach(u => u()); unsubWeek = [];
  if (S.db && id) {
    unsubWeek.push(S.db.collection("weeks").doc(id).collection("nights").onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S.nights = m; render();
    }, onErr));
    unsubWeek.push(S.db.collection("checks").doc(id).onSnapshot(d => { S.checksExist = d.exists; S.checks = d.exists ? d.data() : {}; render(); }, onErr));
  }
  render();
}
function onErr(e) { console.error(e); }

/* ---------- who's cooking ---------- */
// No accounts: each phone remembers whose it is. The name only labels changes ("Last changed by Nihal").
const sb = window.supabase && window.PAX_CONFIG && !/YOUR_/.test(window.PAX_CONFIG.url)
  ? window.supabase.createClient(window.PAX_CONFIG.url, window.PAX_CONFIG.anonKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } })
  : null;
const PEOPLE = ["Prithvi", "Nihal"];

function renderWho() {
  document.body.classList.add("out");
  const mast = document.getElementById("mast"), v = document.getElementById("view");
  mast.hidden = false; mast.innerHTML = masthead({ word: "Pax", dateline: "Dinners at home", title: "Who's cooking?", art: "tomato" });
  v.className = "view";
  v.innerHTML = `<div class="signin"><p class="say">Pick yourself. This phone will remember.</p>
    ${PEOPLE.map(n => `<button class="primary" data-act="iam" data-v="${n}">I'm ${n} ${ICON.arrow}</button>`).join("")}</div>`;
}
handlers.iam = d => { store("local", "pax-me", d.v); start(); };
handlers.signout = () => { store("local", "pax-me", ""); location.reload(); };

async function start() {
  const tok = (location.hash || "").slice(1);
  if (tok === "list" || tok === "recipes") S.tab = tok;
  if (!sb) { document.getElementById("view").innerHTML = `<div class="signin" style="padding:40px 20px"><h1>Almost ready</h1><p class="say">Pax isn't connected to its database yet. Add the Supabase URL and key to config.js.</p></div>`; return; }
  const me = store("local", "pax-me");
  if (!PEOPLE.includes(me)) return renderWho();
  document.body.classList.remove("out");
  S.myName = me;
  const db = window.createPaxDb(sb);
  try { await db.start(); }
  catch (e) { console.error(e); S.offline = !navigator.onLine; toast("Couldn't load the plan. Pull down to retry."); }
  S.db = db;
  let first = true;
  db.collection("weeks").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (/^\d{4}-\d{2}-\d{2}$/.test(d.id)) m[d.id] = d.data(); }); S.weeks = m;
    if (first || !S.weekId) { first = false; S.loaded = true; selectWeek(chooseWeek()); } else render();
  });
  const coll = (name, key) => db.collection(name).onSnapshot(snap => { const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S[key] = m; render(); });
  coll("rejects", "rejects"); coll("box", "box"); coll("inbox", "inbox"); coll("hauls", "hauls");
  db.onPrefix("decks/", snap => {
    const decks = {}, picks = {};
    snap.docs.forEach(d => { const m = /^decks\/(\d{4}-\d{2}-\d{2})(?:\/picks\/(\w+))?$/.exec(d.id); if (!m) return; if (m[2]) (picks[m[1]] = picks[m[1]] || {})[m[2]] = d.data(); else decks[m[1]] = d.data(); });
    S.decks = decks; S.picks = picks; render();
  });
  db.collection("requests").where("status", "==", "open").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S.requests = m; render(); });
  db.collection("staples").doc("list").onSnapshot(d => { S.staples = d.exists ? (d.data().items || []) : []; render(); });
  // Catch up on anything missed while the phone was asleep or offline.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) db.refresh().catch(() => {}); });
  addEventListener("online", () => { S.offline = false; showBanner(); db.refresh().catch(() => {}); });
  addEventListener("offline", () => { S.offline = true; showBanner(); });
  showBanner();
}
start();

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
