<title>Pax</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..500&family=Reenie+Beanie&display=swap">
<style>
/* Layout: a zine taped to the fridge. Red marquee, big wordmark, the week as paper notes, the open night as a white sheet with a receipt beside it. Light only, by design. */
:root {
  --linen: #eee2d4;
  --ink: #000000;
  --paper: #ffffff;
  --tape: #efefef;
  --tomato: #ff6347;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --hand: "Reenie Beanie", "Bradley Hand", "Segoe Print", cursive;
  --print: "Times New Roman", Times, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--linen); overflow-x: clip; }
body { position: relative; background: var(--linen); color: var(--ink); font: 20px/1.3 var(--serif); overflow-x: hidden; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-weight: 400; margin: 0; text-wrap: balance; }
a { color: var(--ink); text-underline-offset: 5px; text-decoration-thickness: 1px; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--tomato); outline-offset: 3px; }
.print { font-family: var(--print); }
.hand { font-family: var(--hand); font-weight: 400; }

.marquee { background: var(--tomato); color: var(--ink); font-size: 20px; line-height: 1; padding-block: 9px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

header.top { position: relative; padding-block: 18px 0; min-height: 210px; }
.decor { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.decor img { position: absolute; display: block; height: auto; max-width: none; }
.v-tomato { top: 52px; right: -70px; width: 360px; transform: rotate(6deg); }
.v-peas { top: 120px; left: 46%; width: 230px; transform: rotate(18deg); }
.v-carrots { bottom: 150px; left: -70px; width: 320px; transform: rotate(-6deg); }
.marquee, header.top, main, footer.band { position: relative; z-index: 1; }
.wordmark { position: relative; z-index: 1; font-size: clamp(120px, 20vw, 230px); line-height: .82; letter-spacing: -0.035em; font-weight: 300; }
nav.tabs { position: relative; z-index: 1; display: flex; gap: 13px; flex-wrap: wrap; margin-top: 18px; }
nav.tabs button { background: var(--paper); border: 1px solid var(--ink); padding: 2px 12px; font-size: 26px; line-height: 1.2; }
nav.tabs button:nth-child(1) { transform: rotate(-2deg); }
nav.tabs button:nth-child(2) { transform: rotate(1.5deg); }
nav.tabs button:nth-child(3) { transform: rotate(-1deg); }
nav.tabs button[aria-current="page"] { background: var(--ink); color: var(--paper); }

main { padding-block: 48px 88px; display: grid; gap: 72px; max-width: 1400px; margin: 0 auto; }
.banner { background: var(--paper); border: 1px solid var(--ink); padding: 10px 12px; font-family: var(--print); font-size: 16px; max-width: 640px; }

/* Week */
.weekhead { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.weekhead h2 { font-size: 34px; }
.weekhead p { margin: 6px 0 0; font-family: var(--print); font-size: 16px; max-width: 620px; }
.ink { background: none; border: 0; padding: 0 2px; font-size: 18px; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; min-height: 40px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: 18px; row-gap: 40px; align-items: start; }
.day { display: grid; gap: 10px; min-width: 0; }
.note-wrap { position: relative; }
.tape { position: absolute; top: -10px; left: 50%; width: 58px; height: 18px; margin-left: -29px; background: var(--tape); border: 1px solid var(--ink); transform: rotate(-4deg); z-index: 1; pointer-events: none; }
.note { display: block; width: 100%; border: 1px solid var(--ink); background: var(--paper); padding: 14px 12px 12px; text-align: left; position: relative; }
.note.away { background: var(--tomato); }
.note[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 5px; }
.note .top { display: flex; justify-content: space-between; font-family: var(--print); font-size: 14px; text-transform: uppercase; }
.note .num { display: block; font-size: 60px; line-height: .95; letter-spacing: -0.03em; margin-top: 2px; font-weight: 300; }
.note .title { display: block; font-family: var(--hand); font-size: 34px; line-height: .95; margin-top: 8px; overflow-wrap: anywhere; }
.note .sub { display: block; font-family: var(--print); font-size: 15px; line-height: 1.25; margin-top: 8px; }
.note .stamp { position: absolute; right: -8px; top: 34px; transform: rotate(-10deg); border: 2px solid var(--ink); background: var(--tomato); padding: 0 8px; font-family: var(--hand); font-size: 30px; line-height: 1.1; }
.label { display: block; width: 100%; background: var(--paper); border: 1px solid var(--ink); padding: 6px 8px; font-size: 17px; line-height: 1.15; text-align: left; min-height: 40px; }
.label:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.daybtns { display: grid; gap: 6px; }

/* Open night */
.open { position: relative; padding-top: 34px; scroll-margin-top: 16px; }
.bigstamp { position: absolute; top: -34px; left: -4px; font-family: var(--hand); font-size: clamp(84px, 11vw, 140px); line-height: 1; color: var(--tomato); transform: rotate(-3deg); pointer-events: none; z-index: 0; }
.closer { position: absolute; top: 0; right: 0; z-index: 2; font-family: var(--print); font-size: 16px; }
.split { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 44px; align-items: start; }
.sheet { background: var(--paper); border: 1px solid var(--ink); padding: 22px; display: grid; gap: 16px; margin-top: 44px; min-width: 0; }
.sheet .kick { font-family: var(--print); font-size: 15px; text-transform: uppercase; }
.sheet h2 { font-size: clamp(38px, 5vw, 54px); line-height: 1; letter-spacing: -0.02em; }
.sheet h2 a { text-decoration-thickness: 1px; }
.sheet .src { font-family: var(--print); font-size: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 10px; }
.tags span { border: 1px solid var(--ink); padding: 1px 8px; font-size: 17px; }
.cookline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.cookline .who { font-family: var(--hand); font-size: 36px; line-height: 1; }
ol.steps { margin: 0; padding-left: 26px; display: grid; gap: 8px; font-size: 20px; }
.tweak { font-family: var(--print); font-size: 16px; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; border-top: 1px solid var(--ink); padding-top: 8px; }
.options { display: grid; gap: 8px; }
.option { text-align: left; background: var(--linen); border: 1px solid var(--ink); padding: 10px 12px; display: grid; gap: 2px; width: 100%; }
.option b { font-family: var(--hand); font-weight: 400; font-size: 30px; line-height: 1; }
.option span { font-family: var(--print); font-size: 15px; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 18px; }
textarea { font: 16px/1.3 var(--print); width: 100%; border: 1px solid var(--ink); background: var(--linen); padding: 8px 10px; border-radius: 0; color: var(--ink); }
.receipt { background: var(--paper); border: 1px solid var(--ink); padding: 16px 18px 20px; transform: rotate(1.5deg); font-family: var(--print); margin-top: 92px; min-width: 0; }
.receipt .rhead { font-size: 15px; text-transform: uppercase; text-align: center; border-bottom: 1px dashed var(--ink); padding-bottom: 8px; }
.receipt ul { margin: 0; padding: 8px 0 0; list-style: none; font-size: 18px; line-height: 1.7; }
.receipt li { border-bottom: 1px dotted var(--ink); }

/* List */
.listgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: start; }
.listgrid .receipt { margin-top: 0; }
.listgrid .receipt:nth-child(2) { transform: rotate(-1.2deg); }
.item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 0; border-bottom: 1px dotted var(--ink); }
.item input { width: 18px; height: 18px; margin-top: 4px; accent-color: var(--ink); }
.item label { cursor: pointer; font-size: 18px; line-height: 1.3; min-width: 0; }
.item label small { display: block; font-size: 14px; }
.item.done label { text-decoration: line-through; }
.item .ink { font-size: 14px; min-height: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--paper); border: 1px solid var(--ink); padding: 2px 10px; font-family: var(--print); font-size: 15px; }
.addrow { display: flex; gap: 8px; margin-top: 10px; }
.addrow input { flex: 1; min-width: 0; font: 16px var(--print); border: 1px solid var(--ink); background: var(--paper); padding: 6px 10px; border-radius: 0; }
.addrow button { background: var(--paper); border: 1px solid var(--ink); padding: 4px 14px; font-size: 18px; }

/* Recipes */
.shelf { display: grid; gap: 4px; }
.shelf h2 { font-size: 34px; margin-bottom: 6px; }
.rec { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px dotted var(--ink); }
.rec .t a, .rec .t b { font-family: var(--hand); font-weight: 400; font-size: 32px; line-height: 1; }
.rec .t small { display: block; font-family: var(--print); font-size: 14px; }
.heart { background: none; border: 0; font-size: 24px; line-height: 1; padding: 4px 6px; min-width: 40px; min-height: 40px; }
.heart[aria-pressed="true"] { color: var(--tomato); }
.empty { font-family: var(--print); font-size: 17px; max-width: 560px; }

footer.band { background: var(--tomato); padding-block: 48px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
footer.band span:first-child { font-size: 30px; line-height: 1.1; max-width: 520px; }
footer.band span:last-child { font-family: var(--print); font-size: 14px; text-transform: uppercase; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) rotate(-1deg); background: var(--paper); border: 1px solid var(--ink); padding: 8px 14px; font-family: var(--print); font-size: 16px; max-width: calc(100% - 32px); z-index: 20; }

@media (max-width: 1150px) { .cal { grid-template-columns: repeat(2, minmax(0, 1fr)); } .split, .listgrid { grid-template-columns: minmax(0, 1fr); } .receipt { margin-top: 0; } }
@media (max-width: 620px) {
  .cal { grid-template-columns: minmax(0, 1fr); row-gap: 34px; }
  .day:nth-child(odd) .note-wrap { transform: rotate(-1deg); margin-right: 10px; }
  .day:nth-child(even) .note-wrap { transform: rotate(1deg); margin-left: 10px; }
  .daybtns { grid-template-columns: 1fr 1fr; gap: 6px; }
  .daybtns .label { font-size: 15px; padding: 4px 6px; min-height: 38px; text-align: center; white-space: nowrap; }
  .daybtns .label:only-child { grid-column: 1 / -1; width: auto; justify-self: start; padding-inline: 12px; }
  .v-tomato { width: 200px; right: -50px; top: 40px; }
  .v-peas { width: 190px; top: 1500px; left: auto; right: -70px; transform: rotate(-8deg); }
  .v-carrots { width: 210px; left: -60px; bottom: 120px; }
  header.top { min-height: 0; }
  .sheet { padding: 16px; }
}
@media (min-width: 621px) {
  .day:nth-child(7n+1) .note-wrap { transform: rotate(-1.5deg); } .day:nth-child(7n+2) .note-wrap { transform: rotate(1.2deg); margin-top: 20px; }
  .day:nth-child(7n+3) .note-wrap { transform: rotate(-.6deg); margin-top: 6px; } .day:nth-child(7n+4) .note-wrap { transform: rotate(1.6deg); margin-top: 26px; }
  .day:nth-child(7n+5) .note-wrap { transform: rotate(-1.1deg); margin-top: 10px; } .day:nth-child(7n+6) .note-wrap { transform: rotate(.8deg); margin-top: 22px; }
  .day:nth-child(7n+7) .note-wrap { transform: rotate(-1.6deg); margin-top: 4px; }
}
</style>

<div class="decor" aria-hidden="true">
  <img class="v-tomato" alt="" src="art/tomato.png">
  <img class="v-peas" alt="" src="art/peas.png">
  <img class="v-carrots" alt="" src="art/carrots.png">
</div>
<div class="marquee gutter" id="marquee">Pax ✶ dinners for two ✶ Pax ✶ dinners for two</div>
<header class="top gutter">
  <h1 class="wordmark">Pax</h1>
  <nav class="tabs" aria-label="Sections">
    <button id="tab-tonight" data-tab="tonight">Week</button>
    <button id="tab-list" data-tab="list">List</button>
    <button id="tab-recipes" data-tab="recipes">Recipes</button>
  </nav>
</header>
<main class="gutter">
  <div id="banner" class="banner" hidden></div>
  <div id="view"><p class="empty">Getting this week's dinners. Once Claude plans a week, every night shows up here as a note with its dish and who's cooking.</p></div>
</main>
<footer class="band gutter"><span>Planned Sunday by Claude. Changed by you two.</span><span>Pax ✶ Prithvi &amp; Nihal</span></footer>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const SLOTS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const DAY = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday", sun: "Sunday" };
const COOK = { prithvi: "Prithvi", nihal: "Nihal" };
const OTHER = { prithvi: "nihal", nihal: "prithvi" };

const S = {
  db: null, user: null, me: null, canWrite: true,
  weeks: {}, weekId: null, nights: {}, checks: {}, rejects: {}, box: {}, staples: [], requests: {},
  tab: "tonight", focus: null, ui: {}, loaded: false,
};
let unsubWeek = [];

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeLink = u => /^https:\/\//i.test(u || "") ? u : "";
const slug = s => String(s || "").toLowerCase().replace(/^https?:\/\//, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 150) || "x";
const recipeKey = r => slug(r.link || r.dish);
const norm = s => String(s || "").trim().toLowerCase();
function localISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); return localISO(new Date(y, m - 1, d + n)); }
function shortDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
const dayNum = iso => String(Number(iso.slice(8)));
const today = () => localISO(new Date());
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }
function stamp() { return { by: S.me || null, at: new Date().toISOString() }; }
function fmtTime(t) { if (!t) return ""; const [h, m] = t.split(":").map(Number); return ((h % 12) || 12) + (m ? ":" + String(m).padStart(2, "0") : "") + (h >= 12 ? "pm" : "am"); }

async function write(fn, okMsg) {
  if (!S.db) { toast("Changes can't be saved here. Open Pax on claude.ai while signed in."); return; }
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) {
    if (e && e.code === "invalid_argument") { S.canWrite = false; showBanner(); render(); toast("You can view Pax but not change it. Ask Prithvi to share it with you as an Editor."); }
    else if (e && e.code === "quota_exceeded") toast("Pax's storage is full. Clear out old weeks to keep saving.");
    else toast("That didn't save. Check your connection and try again.");
  }
}

/* ---------- derived state ---------- */
const week = () => S.weeks[S.weekId] || null;
function slotDate(slot) { return addDays(S.weekId, SLOTS.indexOf(slot)); }
// Plan kinds: cook, out, order, flex ("skip" from older plans reads as out). A night's flag overrides the plan.
const planKind = k => k === "skip" ? "out" : (k || "flex");
const flagMode = f => f === "skip" ? "out" : f;

function nightView(slot) {
  const w = week() || {};
  const plan = (w.nights || {})[slot] || { kind: "flex" };
  const st = S.nights[slot] || {};
  const pk = planKind(plan.kind);
  const mode = flagMode(st.flag) || pk;
  const cook = st.cook || plan.cook || null;
  const rejected = new Set(st.rejected || []);
  const opts = (plan.options || []).filter(o => !rejected.has(o.id) && !S.rejects[recipeKey(o)]);
  let current = null;
  if (st.boxPick && !S.rejects[recipeKey(st.boxPick)]) current = { ...st.boxPick, fromBox: true };
  else current = opts.find(o => o.id === st.current) || opts[0] || null;
  const backups = opts.filter(o => !current || o.id !== current.id);
  const request = Object.values(S.requests).find(r => r.week === S.weekId && r.slot === slot && r.status === "open");
  return { slot, date: slotDate(slot), plan, st, pk, mode, cook, current, backups, request };
}

function noteText(n) {
  if (n.mode === "cook") {
    if (n.current) return { title: n.current.dish, sub: [COOK[n.cook] ? COOK[n.cook] + " cooks" : "", n.current.minutes ? n.current.minutes + " min" : ""].filter(Boolean).join(", ") };
    return { title: "Nothing yet", sub: "Pick from the recipe box or ask Claude" };
  }
  if (n.mode === "flex") return { title: n.plan.label || "Free night", sub: n.plan.note || "Out, in, or leftovers" };
  const planned = n.pk === n.mode;
  const title = planned && n.plan.label ? n.plan.label : (n.mode === "order" ? "Ordering in" : "Eating out");
  const sub = n.current && n.pk === "cook" ? n.current.dish + " is off the list" : (planned ? n.plan.note || "" : "");
  return { title, sub };
}

function chooseWeek() {
  const ids = Object.keys(S.weeks).sort();
  if (!ids.length) return null;
  const t = today();
  return ids.find(id => id <= t && t <= addDays(id, 6)) || ids.find(id => id > t) || ids[ids.length - 1];
}

/* ---------- render ---------- */
function showBanner() {
  const b = document.getElementById("banner");
  if (!S.db && S.loaded) { b.textContent = "You're seeing Pax without its saved plan. Open it on claude.ai while signed in to see and change it."; b.hidden = false; }
  else if (!S.canWrite) { b.textContent = "You can see the plan but not change it. Ask Prithvi to share Pax with you as an Editor."; b.hidden = false; }
  else b.hidden = true;
}

function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  const w = week();
  document.getElementById("marquee").textContent = w ? `Week of ${shortDate(S.weekId)} ✶ ${w.note ? w.note.split(". ")[0].replace(/\.$/, "") : "dinners for two"} ✶ Week of ${shortDate(S.weekId)}` : "Pax ✶ dinners for two ✶ Pax ✶ dinners for two";
  if (!S.loaded) return;
  const v = document.getElementById("view");
  v.innerHTML = S.tab === "list" ? renderList() : S.tab === "recipes" ? renderRecipes() : renderWeekView();
  resolveNames();
}

function noWeek() {
  return `<div class="shelf"><h2>Nothing on the fridge yet</h2><p class="empty">Claude plans each week on Sunday afternoon: a dish for every cook night with two backups, and a note for nights you're out. It'll show up here.</p></div>`;
}

function renderWeekView() {
  if (!week()) return noWeek();
  return `<div style="display:grid;gap:72px">${renderWeek()}${S.focus ? renderOpen(nightView(S.focus)) : ""}</div>`;
}

function renderWeek() {
  const ids = Object.keys(S.weeks).sort();
  const i = ids.indexOf(S.weekId);
  const w = week();
  const dis = S.canWrite ? "" : "disabled";
  let h = `<section aria-labelledby="week-h"><div class="weekhead"><div><h2 id="week-h">On the fridge this week</h2>${w.note ? `<p>${esc(w.note)}</p>` : ""}</div>
    <div class="print" style="display:flex;gap:20px"><button class="ink" data-act="week" data-v="${esc(ids[i - 1] || "")}" ${i > 0 ? "" : "disabled"}>← last week</button><button class="ink" data-act="week" data-v="${esc(ids[i + 1] || "")}" ${i < ids.length - 1 ? "" : "disabled"}>next week →</button></div></div><div class="cal">`;
  const t = today();
  for (const slot of SLOTS) {
    const n = nightView(slot);
    const away = n.mode === "out" || n.mode === "order";
    const { title, sub } = noteText(n);
    const label = `${DAY[slot]} ${shortDate(n.date)}: ${title}${sub ? ". " + sub : ""}`;
    h += `<div class="day"><div class="note-wrap"><span class="tape" aria-hidden="true"></span>
      <button class="note${away ? " away" : ""}" data-act="focus" data-slot="${slot}" aria-pressed="${S.focus === slot}" aria-label="${esc(label)}">
        <span class="top"><span>${DAY[slot]}${n.date === t ? " ✶ today" : ""}</span><span>${esc(shortDate(n.date))}</span></span>
        <span class="num">${dayNum(n.date)}</span>
        <span class="title">${esc(title)}</span>
        ${sub ? `<span class="sub">${esc(sub)}</span>` : ""}
        ${away ? `<span class="stamp" aria-hidden="true">${n.mode === "order" ? "order in" : "out"}</span>` : ""}
      </button></div>
      <div class="daybtns">${away
        ? `<button class="label" data-act="flag" data-slot="${slot}" data-v="cook" ${dis}>We're cooking after all</button>`
        : `<button class="label" data-act="flag" data-slot="${slot}" data-v="order" ${dis}>We're ordering in</button><button class="label" data-act="flag" data-slot="${slot}" data-v="out" ${dis}>We're eating out</button>`}</div></div>`;
  }
  return h + `</div></section>`;
}

function renderOpen(n) {
  const dis = S.canWrite ? "" : "disabled";
  const ui = S.ui[n.slot] || {};
  const time = n.plan.time ? fmtTime(n.plan.time) : "";
  const c = n.mode === "cook" ? n.current : null;
  let sheet = `<span class="kick">${esc(DAY[n.slot])}, ${esc(shortDate(n.date))}${time && c ? " ✶ " + esc(time) : ""}</span>`;
  let receipt = "";

  if (n.mode !== "cook") {
    const { title, sub } = noteText(n);
    sheet += `<h2 id="open-h">${esc(title)}</h2>`;
    if (sub) sheet += `<p class="tweak">${esc(sub)}</p>`;
    if (n.mode === "flex") sheet += renderBoxPicker(n, dis, true);
    if (n.st.flag && n.st.by) sheet += `<p class="tweak" data-by="${esc(n.st.by)}">Marked by <span class="name">someone</span>.</p>`;
    receipt = `<p style="margin:10px 0 0;font-size:17px">Nothing to shop for. This night is off the list.</p>`;
  } else if (!c) {
    sheet += `<h2 id="open-h">Nothing left for ${esc(DAY[n.slot])}</h2><p class="tweak">${(n.plan.options || []).length ? "Both backups are gone." : "Nothing was planned for this night."} Pick something from your recipe box, or ask Claude for two new options.</p>`;
    sheet += renderBoxPicker(n, dis, false) + renderRequest(n, dis);
    receipt = `<p style="margin:10px 0 0;font-size:17px">Pick a dish and its ingredients show up here.</p>`;
  } else {
    const link = safeLink(c.link);
    const hearted = !!S.box[recipeKey(c)];
    sheet += `<h2 id="open-h">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(c.dish)}</a>` : esc(c.dish)}</h2>
      <span class="src">${esc([c.source, c.minutes && c.minutes + " min", c.cuisine, c.fromBox && "from your recipe box"].filter(Boolean).join(", "))}</span>
      <div class="cookline"><span class="who">${esc(COOK[n.cook] || "Whoever's home")} cooks</span>
        ${n.cook ? `<button class="ink" data-act="cook" data-slot="${n.slot}" ${dis}>Hand to ${esc(COOK[OTHER[n.cook]])}</button>` : ""}
        <button class="heart" data-act="heart" data-slot="${n.slot}" aria-pressed="${hearted}" aria-label="${hearted ? "Remove from" : "Save to"} recipe box" ${dis}>${hearted ? "♥" : "♡"}</button></div>
      <div class="tags"><span>Protein: ${esc(c.protein)}</span><span>Carb: ${esc(c.carb)}</span><span>Veg: ${esc(c.veg)}</span></div>`;
    if (c.tweak) sheet += `<p class="tweak">${esc(c.tweak)}</p>`;
    if ((c.steps || []).length) sheet += `<ol class="steps">${c.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`;
    if (ui.mode === "swap") {
      sheet += `<div class="options">${n.backups.map(o => `<button class="option" data-act="pick" data-slot="${n.slot}" data-id="${esc(o.id)}" ${dis}><b>${esc(o.dish)}</b><span>${esc([o.source, o.minutes && o.minutes + " min", o.protein].filter(Boolean).join(", "))}</span></button>`).join("") || `<p class="tweak">No backups left for this night.</p>`}</div>`;
      sheet += renderBoxPicker(n, dis, true);
      sheet += `<div class="actions"><button class="ink" data-act="ui" data-slot="${n.slot}" data-v="">Keep ${esc(c.dish)}</button></div>`;
    } else if (ui.mode === "reject") {
      sheet += `<div class="confirm actions"><span>Never suggest ${esc(c.dish)} again?</span><button class="ink" data-act="reject" data-slot="${n.slot}" ${dis}>Yes, reject it</button><button class="ink" data-act="ui" data-slot="${n.slot}" data-v="">Cancel</button></div>`;
    } else {
      sheet += `<div class="actions">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener" style="font-size:20px">Open the recipe →</a>` : ""}
        <button class="ink" data-act="ui" data-slot="${n.slot}" data-v="swap" ${dis}>Swap${n.backups.length ? ` (${n.backups.length})` : ""}</button>
        <button class="ink" data-act="ui" data-slot="${n.slot}" data-v="reject" ${dis}>Reject</button></div>`;
    }
    if (n.st.by && (n.st.current || n.st.boxPick || (n.st.rejected || []).length || n.st.cook)) sheet += `<p class="tweak" data-by="${esc(n.st.by)}">Last changed by <span class="name">someone</span>.</p>`;
    receipt = (c.ingredients || []).length ? `<ul>${c.ingredients.map(i => `<li>${esc(i)}</li>`).join("")}</ul><p style="margin:10px 0 0;font-size:14px">Quantities are on the recipe page.</p>` : `<p style="margin:10px 0 0;font-size:17px">No ingredient list for this one.</p>`;
  }
  return `<section class="open" id="open" aria-labelledby="open-h"><span class="bigstamp" aria-hidden="true">${esc(DAY[n.slot])}</span><button class="ink closer" data-act="close">Close ✕</button>
    <div class="split"><div class="sheet">${sheet}</div><aside class="receipt" aria-label="What goes in it"><div class="rhead">What goes in it</div>${receipt}</aside></div></section>`;
}

function renderBoxPicker(n, dis, compact) {
  const items = Object.values(S.box).filter(b => !S.rejects[recipeKey(b)]);
  if (!items.length) return compact ? "" : `<p class="tweak">Your recipe box is empty. Tap ♡ on a dish you liked to save it.</p>`;
  return `<details ${compact ? "" : "open"}><summary class="print" style="cursor:pointer;font-size:16px">${n.mode === "flex" ? "Cook something from your recipe box" : "From your recipe box"}</summary><div class="options" style="margin-top:8px">${items.map(b =>
    `<button class="option" data-act="boxpick" data-slot="${n.slot}" data-key="${esc(recipeKey(b))}" ${dis}><b>${esc(b.dish)}</b><span>${esc([b.source, b.minutes && b.minutes + " min", b.protein].filter(Boolean).join(", "))}</span></button>`).join("")}</div></details>`;
}

function renderRequest(n, dis) {
  if (n.request) return `<p class="tweak">You asked Claude for new options${n.request.note ? `: “${esc(n.request.note)}”` : ""}. They'll show up here after Claude's next run.</p>`;
  return `<div style="display:grid;gap:8px"><label for="req-${n.slot}" class="print" style="font-size:15px;text-transform:uppercase">Anything Claude should know?</label>
    <textarea id="req-${n.slot}" rows="2" placeholder="e.g. something with eggs, nothing too heavy"></textarea>
    <div><button class="label" style="width:auto" data-act="request" data-slot="${n.slot}" ${dis}>Ask Claude for new options</button></div></div>`;
}

function buildList() {
  const map = new Map();
  for (const slot of SLOTS) {
    const n = nightView(slot);
    if (n.mode !== "cook" || !n.current) continue;
    for (const raw of n.current.ingredients || []) {
      const k = norm(raw); if (!k) continue;
      if (!map.has(k)) map.set(k, { key: slug(k), name: raw.trim(), dishes: [] });
      map.get(k).dishes.push(DAY[slot].slice(0, 3) + ": " + n.current.dish);
    }
  }
  const staples = new Set(S.staples.map(norm));
  const buy = [], have = [];
  for (const [k, it] of map) (staples.has(k) ? have : buy).push(it);
  const by = (a, b) => a.name.localeCompare(b.name);
  return { buy: buy.sort(by), have: have.sort(by) };
}

function renderList() {
  if (!week()) return noWeek();
  const { buy, have } = buildList();
  const dis = S.canWrite ? "" : "disabled";
  const checks = S.checks.items || {};
  const row = (it, staple) => `<div class="item${checks[it.key] ? " done" : ""}">
    <input type="checkbox" id="chk-${esc(it.key)}" data-act="check" data-key="${esc(it.key)}" ${checks[it.key] ? "checked" : ""} ${dis}>
    <label for="chk-${esc(it.key)}">${esc(it.name)}<small>${esc(it.dishes.join(" · "))}</small></label>
    <button class="ink" data-act="${staple ? "unstaple" : "staple"}" data-name="${esc(it.name)}" ${dis}>${staple ? "not a staple" : "always have it"}</button></div>`;
  return `<div style="display:grid;gap:40px"><div class="shelf"><h2>The list</h2><p class="empty" style="margin:0">Everything for the week of ${esc(shortDate(S.weekId))}, built from the dishes you're cooking. Swap a dish or mark a night as out and this list follows. Quantities are on the recipe pages.</p></div>
    <div class="listgrid">
      <section class="receipt" aria-labelledby="buy-h"><div class="rhead" id="buy-h">Need to buy ✶ ${buy.length}</div>${buy.map(i => row(i, false)).join("") || `<p style="font-size:17px">Nothing to buy. Everything's a staple.</p>`}</section>
      <section class="receipt" aria-labelledby="have-h"><div class="rhead" id="have-h">Probably have ✶ ${have.length}</div><p style="font-size:14px;margin:8px 0 0">Your staples. Worth a quick look before you shop.</p>${have.map(i => row(i, true)).join("") || `<p style="font-size:17px">None of this week's ingredients are staples.</p>`}</section>
    </div>
    <section class="shelf" aria-labelledby="st-h"><h2 id="st-h">Staples</h2><p class="empty" style="margin:0 0 8px">Anything here goes under "Probably have." Tap one to take it off.</p>
      <div class="chips">${S.staples.map(s => `<button class="chip" data-act="unstaple" data-name="${esc(s)}" aria-label="Remove ${esc(s)}" ${dis}>${esc(s)} ×</button>`).join("") || `<span class="empty">No staples yet.</span>`}</div>
      <form class="addrow" id="staple-form"><input type="text" id="staple-input" placeholder="Add a staple, e.g. basmati rice" ${dis}><button ${dis}>Add</button></form></section></div>`;
}

function allPlanned() {
  const seen = new Map();
  for (const id of Object.keys(S.weeks).sort().reverse()) {
    const w = S.weeks[id];
    for (const slot of SLOTS) for (const o of ((w.nights || {})[slot] || {}).options || []) {
      const k = recipeKey(o);
      if (!seen.has(k)) seen.set(k, { ...o, week: id });
    }
  }
  return [...seen.values()];
}

function renderRecipes() {
  const dis = S.canWrite ? "" : "disabled";
  const box = Object.values(S.box).sort((a, b) => a.dish.localeCompare(b.dish));
  const rec = (r, extra) => {
    const link = safeLink(r.link); const k = recipeKey(r); const hearted = !!S.box[k];
    return `<div class="rec"><div class="t">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(r.dish)}</a>` : `<b>${esc(r.dish)}</b>`}<small>${esc([r.source, r.cuisine, r.minutes && r.minutes + " min", extra].filter(Boolean).join(", "))}</small></div>
      <button class="heart" data-act="heartrec" data-key="${esc(k)}" aria-pressed="${hearted}" aria-label="${hearted ? "Remove from" : "Save to"} recipe box" ${dis}>${hearted ? "♥" : "♡"}</button></div>`;
  };
  const planned = allPlanned().filter(r => !S.rejects[recipeKey(r)]);
  const rej = Object.entries(S.rejects);
  return `<div style="display:grid;gap:56px">
    <section class="shelf"><h2>Recipe box</h2>${box.length ? box.map(r => rec(r)).join("") : `<p class="empty">Nothing saved yet. Tap ♡ on a dinner you loved, and you can pull it into any night.</p>`}</section>
    <section class="shelf"><h2>Every dish Claude has suggested</h2>${planned.map(r => rec(r, "week of " + shortDate(r.week))).join("") || `<p class="empty">None yet.</p>`}</section>
    <section class="shelf"><h2>Rejected</h2><p class="empty" style="margin:0 0 6px">Claude won't suggest these again.</p>
      ${rej.map(([k, r]) => `<div class="rec"><div class="t"><b>${esc(r.dish)}</b><small>${esc(r.source || "")}</small></div><button class="ink" data-act="unreject" data-key="${esc(k)}" ${dis}>Allow again</button></div>`).join("") || `<p class="empty">Nothing rejected.</p>`}</section></div>`;
}

async function resolveNames() {
  if (!S.user || !S.user.profiles) return;
  const els = [...document.querySelectorAll("[data-by]")].filter(e => e.dataset.by);
  if (!els.length) return;
  const ps = await S.user.profiles([...new Set(els.map(e => e.dataset.by))]);
  for (const e of els) { const p = ps[e.dataset.by]; const span = e.querySelector(".name"); if (span) span.textContent = p && p.isMe ? "you" : (p && p.name) || "someone"; }
}

/* ---------- actions ---------- */
function nightRef(slot) { return S.db.collection("weeks").doc(S.weekId).collection("nights").doc(slot); }
async function saveNight(slot, patch) {
  const next = { ...(S.nights[slot] || {}), ...patch, ...stamp() };
  S.nights[slot] = next; render();
  await nightRef(slot).set(next);
}

const handlers = {
  focus: d => {
    S.focus = S.focus === d.slot ? null : d.slot; S.ui = {}; render();
    const el = document.getElementById("open");
    if (el) el.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  },
  ui: d => { S.ui[d.slot] = { mode: d.v }; render(); },
  close: () => { S.focus = null; S.ui = {}; render(); },
  week: d => { if (d.v) selectWeek(d.v); },
  pick: d => write(() => { S.ui = {}; return saveNight(d.slot, { current: d.id, boxPick: null }); }, "Swapped."),
  boxpick: d => { const b = S.box[d.key]; if (!b) return; write(() => { S.ui = {}; return saveNight(d.slot, { boxPick: b, flag: "cook" }); }, `${b.dish} it is.`); },
  reject: d => {
    const n = nightView(d.slot); const c = n.current; if (!c) return;
    write(async () => {
      S.ui = {};
      const patch = c.fromBox ? { boxPick: null } : { rejected: [...new Set([...(n.st.rejected || []), c.id])], current: null };
      await saveNight(d.slot, patch);
      await S.db.collection("rejects").doc(recipeKey(c)).set({ dish: c.dish, source: c.source || "", link: c.link || "", week: S.weekId, slot: d.slot, ...stamp() });
    }, `${c.dish} won't come back.`);
  },
  cook: d => { const n = nightView(d.slot); write(() => saveNight(d.slot, { cook: OTHER[n.cook] }), `${COOK[OTHER[n.cook]]} has ${DAY[d.slot]}.`); },
  flag: d => {
    const n = nightView(d.slot);
    // Back to cooking clears the flag when the plan already says cook; otherwise it overrides a planned night out.
    const v = d.v === "cook" ? (n.pk === "cook" ? null : "cook") : d.v;
    const msg = d.v === "order" ? "Ordering in. Its ingredients are off the list." : d.v === "out" ? "Eating out. Its ingredients are off the list." : "Back to cooking.";
    write(() => saveNight(d.slot, { flag: v }), msg);
  },
  heart: d => toggleBox(nightView(d.slot).current),
  heartrec: d => toggleBox(S.box[d.key] || allPlanned().find(r => recipeKey(r) === d.key)),
  unreject: d => write(() => S.db.collection("rejects").doc(d.key).delete(), "Allowed again."),
  request: d => {
    const note = (document.getElementById("req-" + d.slot) || {}).value || "";
    write(() => S.db.collection("requests").add({ week: S.weekId, slot: d.slot, note: note.trim().slice(0, 500), status: "open", ...stamp() }), "Asked. Claude will add options on its next run.");
  },
  check: d => {
    const items = { ...(S.checks.items || {}) }; const on = !items[d.key]; items[d.key] = on; S.checks = { ...S.checks, items }; render();
    write(async () => {
      const ref = S.db.collection("checks").doc(S.weekId);
      try { await ref.update({ items: { [d.key]: on } }); }
      catch (e) { if (e && e.code === "invalid_argument" && !S.checksExist) await ref.set({ items }); else throw e; }
    });
  },
  staple: d => saveStaples([...S.staples, d.name]),
  unstaple: d => saveStaples(S.staples.filter(s => norm(s) !== norm(d.name))),
};

function toggleBox(r) {
  if (!r) return;
  const k = recipeKey(r);
  if (S.box[k]) return write(() => S.db.collection("box").doc(k).delete(), "Removed from your recipe box.");
  const keep = ["dish", "source", "link", "cuisine", "minutes", "protein", "carb", "veg", "ingredients", "steps", "tweak"];
  const doc = { id: "box-" + k.slice(0, 40) }; keep.forEach(f => { if (r[f] !== undefined) doc[f] = r[f]; });
  write(() => S.db.collection("box").doc(k).set({ ...doc, ...stamp() }), "Saved to your recipe box.");
}

function saveStaples(list) {
  const seen = new Set(); const items = [];
  for (const s of list) { const t = s.trim(); if (t && !seen.has(norm(t))) { seen.add(norm(t)); items.push(t); } }
  S.staples = items; render();
  write(() => S.db.collection("staples").doc("list").set({ items, ...stamp() }));
}

document.addEventListener("click", e => {
  const tab = e.target.closest("nav.tabs button");
  if (tab) { S.tab = tab.dataset.tab; S.ui = {}; render(); try { history.replaceState(null, "", "#" + (S.tab === "tonight" ? "week" : S.tab)); } catch (_) {} return; }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled || el.dataset.act === "check") return;
  const h = handlers[el.dataset.act]; if (h) h(el.dataset);
});
document.addEventListener("change", e => { const el = e.target.closest("[data-act=check]"); if (el) handlers.check(el.dataset); });
document.addEventListener("submit", e => {
  if (e.target.id !== "staple-form") return;
  e.preventDefault(); const inp = document.getElementById("staple-input");
  if (inp.value.trim()) saveStaples([...S.staples, inp.value]);
});

/* ---------- data ---------- */
function selectWeek(id) {
  S.weekId = id; S.focus = null; S.ui = {}; S.nights = {}; S.checks = {}; S.checksExist = false;
  unsubWeek.forEach(u => u()); unsubWeek = [];
  if (S.db && id) {
    unsubWeek.push(S.db.collection("weeks").doc(id).collection("nights").onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S.nights = m; render();
    }, onErr));
    unsubWeek.push(S.db.collection("checks").doc(id).onSnapshot(d => { S.checksExist = d.exists; S.checks = d.exists ? d.data() : {}; render(); }, onErr));
  }
  render();
}
function onErr(e) { if (e && e.code === "revoked") { S.db = null; showBanner(); } }

async function start() {
  const tok = (location.hash || "").slice(1);
  if (tok === "list" || tok === "recipes") S.tab = tok;
  render();
  const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
  S.db = db; S.user = user;
  if (user) {
    try { S.me = await user.id(); } catch (_) {}
    try { const c = await user.can("data.write"); if (c === false) S.canWrite = false; } catch (_) {}
  }
  if (!db) { S.loaded = true; S.canWrite = false; showBanner(); render(); return; }
  let first = true;
  db.collection("weeks").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (/^\d{4}-\d{2}-\d{2}$/.test(d.id)) m[d.id] = d.data(); }); S.weeks = m;
    if (first || !S.weeks[S.weekId]) { first = false; S.loaded = true; selectWeek(chooseWeek()); } else render();
  }, onErr);
  const coll = (name, key) => db.collection(name).onSnapshot(snap => { const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S[key] = m; render(); }, onErr);
  coll("rejects", "rejects"); coll("box", "box");
  db.collection("requests").where("status", "==", "open").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S.requests = m; render(); }, onErr);
  db.collection("staples").doc("list").onSnapshot(d => { S.staples = d.exists ? (d.data().items || []) : []; render(); }, onErr);
  showBanner();
}
start();
</script>
